<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="100%" height="100%" fill="none">  <defs>    <!-- Retained Color Palette -->    <linearGradient id="bubbleGradient" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#0284c7" />      <stop offset="48%" stop-color="#06b6d4" />      <stop offset="100%" stop-color="#0d9488" />    </linearGradient>    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">      <stop offset="0%" stop-color="#fb923c" />      <stop offset="50%" stop-color="#ea580c" />    </linearGradient>    <!-- Modern Soft Ambient Shadow -->    <filter id="modernShadow" x="-15%" y="-15%" width="130%" height="145%" filterUnits="userSpaceOnUse">      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0369a1" flood-opacity="0.25" />      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08" />    </filter>    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#ea580c" flood-opacity="0.4" />    </filter>  </defs>  <style>    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&amp;display=swap');    .title-na {      font-family: 'Nunito', system-ui, -apple-system, sans-serif;      font-weight: 900;      font-size: 88px;      letter-spacing: -1px;      fill: #ffffff;    }    .title-doch {      font-family: 'Nunito', system-ui, -apple-system, sans-serif;      font-weight: 900;      font-size: 96px;      letter-spacing: -1.5px;      fill: #ffffff;    }    .subtitle-text {      font-family: 'Nunito', system-ui, -apple-system, sans-serif;      font-size: 19px;      letter-spacing: 0.2px;    }  </style>  <!-- ==================== BACKGROUND PLAYFUL ELEMENTS ==================== -->  <!-- Ambient Audio Pulse / Sound Rings -->  <g fill="none" stroke-linecap="round">    <path d="M 685,98 A 54,54 0 0,1 702,175" stroke="#ffffff" stroke-width="4.5" opacity="0.65" />    <path d="M 708,80 A 82,82 0 0,1 728,198" stroke="#bae6fd" stroke-width="3.5" opacity="0.4" />  </g>  <!-- Playful Floating Sparkles & Dots -->  <path d="M 648,82 Q 648,92 638,92 Q 648,92 648,102 Q 648,92 658,92 Q 648,92 648,82 Z" fill="#ffffff" opacity="0.85" />  <circle cx="682" cy="74" r="3.5" fill="#fb923c" opacity="0.9" />  <circle cx="160" cy="115" r="4" fill="#bae6fd" opacity="0.6" />  <circle cx="142" cy="135" r="2.5" fill="#ffffff" opacity="0.4" />  <!-- ==================== DYNAMIC SPEECH BUBBLE ==================== -->  <!-- Offset Playful Orange Energy Rim -->  <path     d="M 188,72 L 642,66 C 685,66 718,98 720,140 L 722,216 C 722,258 688,292 646,294 L 285,302 L 192,368 C 180,376 166,368 170,352 L 178,300 C 138,296 112,260 114,218 L 118,142 C 120,98 152,72 188,72 Z"    stroke="url(#accentGradient)"     stroke-width="5"     stroke-linecap="round"    stroke-linejoin="round"    fill="none"    opacity="0.95"    transform="translate(-4, 6)"  />  <!-- Main Squircle Bubble Body -->  <path     d="M 192,68 L 646,62 C 686,62 718,94 720,134 L 722,212 C 722,252 690,286 650,288 L 285,296 L 196,360 C 187,366 174,360 177,348 L 184,295 C 144,290 118,256 120,216 L 124,138 C 126,96 156,68 192,68 Z"     fill="url(#bubbleGradient)"    filter="url(#modernShadow)"  />  <!-- Subtle Top Specular Glass Curve -->  <path     d="M 190,74 L 645,68 C 675,68 698,90 703,120 C 625,128 320,142 135,130 C 142,98 162,74 190,74 Z"     fill="#ffffff"     opacity="0.12"   />  <!-- ==================== BRAND TYPOGRAPHY (NUNITO) ==================== -->  <!-- "Na" (Playfully bounced upward by 3.5 degrees) -->  <g transform="rotate(-3.5 255 186)">    <text x="255" y="186" text-anchor="middle" class="title-na">Na</text>  </g>  <!-- "Doch" (Anchored with a confident 1-degree tilt) -->  <g transform="rotate(1 435 188)">    <text x="435" y="188" text-anchor="middle" class="title-doch">Doch</text>  </g>  <!-- Stylized Orange Exclamation Mark (Popping outward at +11 degrees) -->  <g transform="rotate(11 590 162)" filter="url(#accentGlow)">    <!-- Outer White Punch Border -->    <path       d="M 584,98 C 584,86 606,86 606,98 L 600,152 C 600,157 594,161 590,161 C 586,161 580,157 580,152 Z"       fill="#ffffff"       stroke="#ffffff"       stroke-width="7"       stroke-linejoin="round"    />    <circle cx="590" cy="180" r="12" fill="#ffffff" stroke="#ffffff" stroke-width="6" />    <!-- Gradient Stem & Dot -->    <path       d="M 584,98 C 584,88 606,88 606,98 L 600,152 C 600,156 595,159 590,159 C 585,159 580,156 580,152 Z"       fill="url(#accentGradient)"     />    <circle cx="590" cy="180" r="10.5" fill="url(#accentGradient)" />    <!-- Specular Highlight Shine -->    <ellipse cx="587" cy="102" rx="3.5" ry="5.5" fill="#ffffff" opacity="0.65" />  </g>  <!-- ==================== MODERN CAPSULE SUBTITLE ==================== -->  <!-- Frosted Glass Pill Capsule Container -->  <g transform="translate(0, 4)">    <rect       x="190"       y="226"       width="455"       height="40"       rx="20"       fill="#ffffff"       fill-opacity="0.14"       stroke="#ffffff"       stroke-opacity="0.28"       stroke-width="1.2"     />    <!-- Interactive Triad Track (Nunito) -->    <text x="417" y="253" text-anchor="middle" class="subtitle-text">      <tspan fill="#bae6fd" font-weight="600">Von </tspan>      <tspan fill="#ffffff" font-weight="800">„Na?“</tspan>      <tspan fill="#bae6fd" font-weight="600"> über </tspan>      <tspan fill="#ffffff" font-weight="800">„Ach so!“</tspan>      <tspan fill="#bae6fd" font-weight="600"> zu </tspan>      <tspan fill="#ffffff" font-weight="800">„Doch!“</tspan>    </text>  </g></svg>