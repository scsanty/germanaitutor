        question: "Partner: 'Können Sie mir bitte Ihren Stift leihen?' - Welche Antwort ist freundlich und passend?"
        options: [
          "Nein, weg da!",
          "Ja gerne, bitte sehr.",
          "Ich habe keinen Hunger.",
          "Der Stift ist blau."
