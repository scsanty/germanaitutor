track: generic
level: A2

lessons:
  - slug: perfekt-haben-regular
    skill: grammar
    title: "Conversational Past: Perfekt with Haben and Regular Verbs"
    prerequisites: []
    explanation: |
      In spoken and informal written German, the Perfekt tense is used to talk about completed past events.
      It is formed with a conjugated present-tense auxiliary verb (usually haben) in the second position (V2) and a past participle (Partizip II) at the end of the clause.
      Regular weak verbs form the participle with the prefix ge-, the verb stem, and the suffix -t (ge- + stem + -t, e.g., gemacht, gelernt).
      Verbs ending in -ieren form their participle without ge- (e.g., studiert, reserviert).
    examples:
      - "Ich habe gestern meine Hausaufgaben gemacht."
      - "Wir haben am Wochenende Deutsch gelernt."
      - "Er hat ein Doppelzimmer im Hotel reserviert."
      - "Hast du gestern mit deinen Eltern telefoniert?"
    exercises:
      - type: fill_blank
        textWithBlank: "Maria ___ gestern eine leckere Suppe gekocht."
        correctAnswer: "hat"
      - type: multiple_choice
        question: "Was ist das richtige Partizip II von 'kaufen'?"
        options: ["gekaufen", "gekauft", "kaufte", "bekauft"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wir haben im Restaurant einen Tisch ___ . (reservieren)"
        correctAnswer: "reserviert"
      - type: flashcard
        front: "machen -> hat gemacht"
        back: "to do/make -> did/has made"

  - slug: perfekt-sein-movement
    skill: grammar
    title: "Conversational Past: Perfekt with Sein and Irregular Verbs"
    prerequisites: [perfekt-haben-regular]
    explanation: |
      Verbs that indicate a change of location (e.g., gehen, fahren, fliegen) or a change of state (e.g., aufwachen, einschlafen) use sein instead of haben as their auxiliary in the Perfekt.
      The verbs sein (ist gewesen) and bleiben (ist geblieben) also take sein.
      Strong and irregular verbs often change their stem vowel in the participle and end in -en rather than -t (e.g., gefahren, gegangen).
    examples:
      - "Ich bin gestern nach Berlin gefahren."
      - "Sie ist am Sonntag zu Hause geblieben."
      - "Wir sind um acht Uhr am Bahnhof angekommen."
      - "Bist du schon einmal nach Italien geflogen?"
    exercises:
      - type: multiple_choice
        question: "Welches Hilfsverb ist korrekt? 'Er ___ gestern spät nach Hause gekommen.'"
        options: ["hat", "ist", "wird", "war"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wir ___ am Wochenende nach Wien gefahren."
        correctAnswer: "sind"
      - type: fill_blank
        textWithBlank: "Anna ist gestern den ganzen Tag im Bett ___ . (bleiben)"
        correctAnswer: "geblieben"
      - type: flashcard
        front: "gehen -> ist gegangen"
        back: "to go -> went / has gone"

  - slug: praeteritum-sein-haben
    skill: grammar
    title: "Simple Past: Präteritum of Sein and Haben"
    prerequisites: []
    explanation: |
      While spoken German prefers the Perfekt for most verbs, the simple past (Präteritum) of sein and haben is widely preferred in both spoken and written registers.
      The forms of sein are: ich war, du warst, er/sie/es war, wir waren, ihr wart, sie/Sie waren.
      The forms of haben are: ich hatte, du hattest, er/sie/es hatte, wir hatten, ihr hattet, sie/Sie hatten.
      These forms express past states of being, possession, availability, or emotions.
    examples:
      - "Gestern war ich sehr müde."
      - "Wir hatten am Montag keine Zeit."
      - "Wo warst du am letzten Wochenende?"
      - "Hattet ihr früher ein Haustier?"
    exercises:
      - type: fill_blank
        textWithBlank: "Letztes Jahr ___ wir im Sommer in Spanien."
        correctAnswer: "waren"
      - type: multiple_choice
        question: "Welche Form von 'haben' ist korrekt? 'Ich ___ gestern viel Stress im Büro.'"
        options: ["hatte", "hat", "hätte", "habte"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "___ du gestern krank, Lisa?"
        correctAnswer: "Warst"
      - type: flashcard
        front: "wir hatten / wir waren"
        back: "we had / we were"

  - slug: praeteritum-modal-verbs
    skill: grammar
    title: "Simple Past: Präteritum of Modal Verbs"
    prerequisites: [praeteritum-sein-haben]
    explanation: |
      In both spoken and written German, modal verbs are almost always used in the Präteritum rather than the compound Perfekt.
      The Präteritum stems drop any umlauts: können -> konnte, müssen -> musste, dürfen -> durfte, wollen -> wollte, sollen -> sollte.
      The personal endings match the regular past paradigm: ich -te, du -test, er/sie/es -te, wir -ten, ihr -tet, sie/Sie -ten.
      The first and third person singular forms are always identical (ich konnte, er konnte).
    examples:
      - "Ich konnte gestern leider nicht zur Schule kommen."
      - "Er musste am Wochenende viele Stunden arbeiten."
      - "Wir wollten ins Kino gehen, aber die Karten waren ausverkauft."
      - "Durftest du als Kind alleine in die Stadt fahren?"
    exercises:
      - type: fill_blank
        textWithBlank: "Gestern ___ ich wegen der Grippe den ganzen Tag im Bett bleiben. (müssen)"
        correctAnswer: "musste"
      - type: multiple_choice
        question: "Welche Form ist korrekt? '___ ihr gestern die Hausaufgabe machen?'"
        options: ["Konntet", "Könntet", "Konnten", "Konnte"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Wir ___ gestern nicht schwimmen gehen, weil es geregnet hat. (können)"
        correctAnswer: "konnten"
      - type: flashcard
        front: "ich musste / er musste"
        back: "I had to / he had to"

  - slug: dative-personal-pronouns
    skill: grammar
    title: "Dative Case and Dative Personal Pronouns"
    prerequisites: []
    explanation: |
      The dative case marks the indirect object, answering the question 'Wem?' (To whom?).
      Dative personal pronouns are: mir (me), dir (you, inf.), ihm (him/it), ihr (her), ihm (it), uns (us), euch (you pl.), ihnen (them), and Ihnen (you, formal).
      Certain verbs strictly govern the dative case without a direct object, including helfen (to help), danken (to thank), gefallen (to please), gehören (to belong to), and passen (to fit/suit).
    examples:
      - "Kannst du mir bitte helfen?"
      - "Das rote Kleid gefällt ihr sehr gut."
      - "Das Buch gehört ihm nicht."
      - "Wie geht es Ihnen heute?"
    exercises:
      - type: fill_blank
        textWithBlank: "Ich danke ___ herzlich für die Einladung! (dir / informal singular)"
        correctAnswer: "dir"
      - type: multiple_choice
        question: "Welches Pronomen steht im Dativ? 'Der Chef hilft ___ bei der Arbeit.'"
        options: ["uns", "wir", "unser", "wirklich"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Entschuldigung, gehört dieser Koffer ___? (Ihnen / formal)"
        correctAnswer: "Ihnen"
      - type: flashcard
        front: "ihr (Dativ von sie/she)"
        back: "to her"

  - slug: dative-prepositions
    skill: grammar
    title: "Fixed Dative Prepositions"
    prerequisites: [dative-personal-pronouns]
    explanation: |
      Certain prepositions in German are always followed by the dative case, regardless of movement or context.
      The primary dative prepositions are: aus (out of, from), bei (at, with), mit (with, by means of), nach (after, to), seit (since, for), von (from, of), zu (to), and gegenüber (opposite).
      Articles decline in the dative: masculine dem (einem), feminine der (einer), neuter dem (einem), and plural den + -n on the noun (keinen Freunden).
    examples:
      - "Ich fahre jeden Morgen mit dem Bus zur Arbeit."
      - "Er wohnt seit einem Jahr in Hamburg."
      - "Nach dem Unterricht gehen wir alle zusammen nach Hause."
      - "Sie kommt gerade vom Arzt."
    exercises:
      - type: multiple_choice
        question: "Welcher Artikel folgt auf 'mit'? 'Ich fahre mit ___ Zug.'"
        options: ["dem", "den", "der", "das"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Sie wohnt schon seit ___ Woche in ihrer neuen Wohnung. (eine / feminine)"
        correctAnswer: "einer"
      - type: fill_blank
        textWithBlank: "Nach ___ Essen trinken wir noch einen Kaffee. (das Essen / neuter)"
        correctAnswer: "dem"
      - type: flashcard
        front: "zu + dem / bei + dem"
        back: "zum / beim (contracted forms)"

  - slug: two-way-prepositions-location-direction
    skill: grammar
    title: "Two-Way Prepositions: Accusative vs. Dative"
    prerequisites: [dative-prepositions]
    explanation: |
      Nine prepositions can govern either the accusative or the dative case: an, auf, hinter, in, neben, über, unter, vor, and zwischen.
      Use the accusative when describing directional movement or a change of location answering the question 'Wohin?' (Where to?).
      Use the dative when describing a static location or state of rest answering the question 'Wo?' (Where?).
      Common verb pairs reflect this rule: legen/liegen, stellen/stehen, setzen/sitzen.
    examples:
      - "Das Buch liegt auf dem Tisch. (Wo? -> Dativ)"
      - "Ich lege das Buch auf den Tisch. (Wohin? -> Akkusativ)"
      - "Die Kinder spielen im (in dem) Garten. (Wo? -> Dativ)"
      - "Wir gehen heute Abend ins (in das) Kino. (Wohin? -> Akkusativ)"
    exercises:
      - type: multiple_choice
        question: "Wo steht die Lampe? 'Die Lampe steht neben ___ Bett (das Bett).'"
        options: ["dem", "das", "den", "des"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Ich hänge das Bild an ___ Wand. (die Wand / direction: Wohin?)"
        correctAnswer: "die"
      - type: fill_blank
        textWithBlank: "Der Schlüssel liegt unter ___ Sofa. (das Sofa / location: Wo?)"
        correctAnswer: "dem"
      - type: flashcard
        front: "Wohin? (movement) vs. Wo? (location)"
        back: "Akkusativ vs. Dativ"

  - slug: subordinate-clauses-weil-dass
    skill: grammar
    title: "Subordinate Clauses with Weil and Dass"
    prerequisites: []
    explanation: |
      Subordinate clauses (Nebensätze) introduced by conjunctions such as weil (because) and dass (that) alter German clause topology.
      The subordinate clause is separated by a comma, and the conjugated finite verb is kicked to the very end of the clause.
      'Weil' introduces causal explanations, while 'dass' introduces content clauses reporting thoughts, feelings, or facts.
    examples:
      - "Ich bleibe heute im Bett, weil ich krank bin."
      - "Er lernt fleißig, weil er die Prüfung bestehen will."
      - "Ich weiß, dass du morgen Geburtstag hast."
      - "Wir hoffen, dass das Wetter am Wochenende schön wird."
    exercises:
      - type: multiple_choice
        question: "Welcher Satz hat die richtige Verbposition?"
        options: [
          "Er kommt nicht, weil er hat keine Zeit.",
          "Er kommt nicht, weil er keine Zeit hat.",
          "Er kommt nicht, weil er ist keine Zeit habend.",
          "Er kommt nicht, weil hat er keine Zeit."
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Ich glaube, dass mein Kollege heute später ___ . (kommen)"
        correctAnswer: "kommt"
      - type: free_text
        prompt: "Complete the sentence using 'weil': 'Ich lerne Deutsch, weil... (I want to work in Germany)'."
        modelAnswer: "Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte."

  - slug: indirect-questions-ob-w-fragen
    skill: grammar
    title: "Indirect Questions with Ob and W-Words"
    prerequisites: [subordinate-clauses-weil-dass]
    explanation: |
      Indirect questions sound more polite than direct questions in everyday interactions.
      They function syntactically as subordinate clauses, meaning the conjugated verb moves to the end.
      Yes/No questions become indirect questions introduced by ob (whether/if): 'Kommt der Bus?' -> 'Können Sie mir sagen, ob der Bus kommt?'.
      Information questions retain their question word (wann, wo, wie, was): 'Wann fährt der Zug?' -> 'Ich möchte wissen, wann der Zug abfährt.'.
    examples:
      - "Können Sie mir sagen, wo der Bahnhof ist?"
      - "Ich weiß nicht, ob das Geschäft heute geöffnet ist."
      - "Darf ich fragen, wie viel das Zimmer pro Nacht kostet?"
      - "Wissen Sie, wann die Vorlesung beginnt?"
    exercises:
      - type: fill_blank
        textWithBlank: "Können Sie mir sagen, wie spät es ___ ? (sein)"
        correctAnswer: "ist"
      - type: multiple_choice
        question: "Welche indirekte Frage ist syntaktisch korrekt?"
        options: [
          "Wissen Sie, wann kommt der Zug an?",
          "Wissen Sie, wann der Zug ankommt?",
          "Wissen Sie, wann der Zug kommt an?",
          "Wissen Sie, wann ankommt der Zug?"
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Ich möchte wissen, ___ Sie ein freies Zimmer haben. (whether/if)"
        correctAnswer: "ob"
      - type: free_text
        prompt: "Turn this direct question into an indirect question starting with 'Können Sie mir sagen...': 'Wo ist der Ausgang?'"
        modelAnswer: "Können Sie mir sagen, wo der Ausgang ist?"

  - slug: comparative-and-superlative
    skill: grammar
    title: "Comparison of Adjectives: Comparative and Superlative"
    prerequisites: []
    explanation: |
      The comparative compares two entities and is formed by adding -er to the adjective stem, followed by als (e.g., schneller als).
      Monosyllabic adjectives with stem vowels a, o, u frequently take an umlaut (alt -> älter, groß -> größer, warm -> wärmer).
      The superlative is formed with am + stem + -sten (am schnellsten, am größten).
      Key irregular forms must be memorized: gut -> besser -> am besten; viel -> mehr -> am meisten; gern -> lieber -> am liebsten.
    examples:
      - "Mein Bruder ist älter als ich."
      - "Der Zug ist schneller als das Auto."
      - "Welches Smartphone ist am billigsten?"
      - "Ich trinke gerne Kaffee, aber Tee trinke ich lieber."
    exercises:
      - type: fill_blank
        textWithBlank: "Ein Flugzeug ist ___ als ein Zug. (schnell)"
        correctAnswer: "schneller"
      - type: multiple_choice
        question: "Was ist der Superlativ von 'gut'?"
        options: ["am gutsten", "am besten", "am gütigsten", "am bessersten"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Im Juli ist es in Deutschland am ___ . (warm -> stem takes umlaut)"
        correctAnswer: "wärmsten"
      - type: flashcard
        front: "gern -> lieber -> am liebsten"
        back: "gladly -> prefer / rather -> most of all"

  - slug: adjective-declension-definite-articles
    skill: grammar
    title: "Adjective Declension after Definite Articles"
    prerequisites: [dative-personal-pronouns]
    explanation: |
      When an adjective stands between a determiner and a noun, it must take an inflectional ending.
      After definite articles (der, die, das), the adjective takes only two possible endings in the singular and plural: -e or -en.
      In the nominative singular: der alte Tisch (-e), die neue Lampe (-e), das schöne Bild (-e).
      Every other form takes -en: all accusative masculine forms (den alten Tisch), all dative forms (dem alten Tisch, der neuen Lampe), and all plurals (die neuen Tische).
    examples:
      - "Der alte Mann geht im Park spazieren."
      - "Ich kaufe den schwarzen Mantel."
      - "Wir wohnen in dem gelben Haus."
      - "Die neuen Nachbarn sind sehr freundlich."
    exercises:
      - type: fill_blank
        textWithBlank: "Woher hast du die toll___ Jacke? (feminine accusative with definite article)"
        correctAnswer: "e"
      - type: multiple_choice
        question: "Welche Endung ist korrekt? 'Ich spreche mit dem neu___ Mitarbeiter.'"
        options: ["-e", "-en", "-em", "-es"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Er kauft den billig___ Laptop. (masculine accusative)"
        correctAnswer: "en"
      - type: flashcard
        front: "in dem neuen Restaurant (Dativ)"
        back: "in the new restaurant"

  - slug: reflexive-verbs-intro
    skill: grammar
    title: "Introduction to Reflexive Verbs"
    prerequisites: [dative-personal-pronouns]
    explanation: |
      Reflexive verbs express actions that reflect back onto the grammatical subject.
      They are accompanied by a reflexive pronoun (Reflexivpronomen) in the accusative: mich (myself), dich (yourself), sich (himself/herself/itself), uns (ourselves), euch (yourselves), and sich (themselves/yourself formal).
      Common A2 reflexive verbs include: sich freuen (to look forward to / be happy), sich ärgern (to be annoyed), sich fühlen (to feel), sich beeilen (to hurry), and sich waschen (to wash oneself).
    examples:
      - "Ich fühle mich heute gar nicht gut."
      - "Wir müssen uns beeilen, der Bus kommt gleich."
      - "Freust du dich auf das Wochenende?"
      - "Die Schüler setzen sich auf ihre Stühle."
    exercises:
      - type: fill_blank
        textWithBlank: "Bitte beeil ___ , wir haben keine Zeit mehr! (du)"
        correctAnswer: "dich"
      - type: multiple_choice
        question: "Welches Reflexivpronomen passt? 'Herr Wagner ärgert ___ über den Zug.'"
        options: ["mich", "dich", "sich", "ihn"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Wir freuen ___ sehr auf Ihren Besuch."
        correctAnswer: "uns"
      - type: flashcard
        front: "sich beeilen"
        back: "to hurry up"

  - slug: temporal-prepositions-vor-nach-seit
    skill: grammar
    title: "Temporal Prepositions: Vor, Nach, Seit, and Ab"
    prerequisites: [dative-prepositions]
    explanation: |
      Temporal prepositions indicate when an event happens, its sequence, or its duration.
      'Vor' (before / ago) and 'nach' (after) always take the dative: vor dem Frühstück (before breakfast); vor einem Jahr (a year ago).
      'Seit' indicates an action that began in the past and is still ongoing in the present, used with the present tense and dative: seit zwei Monaten (for two months).
      'Ab' indicates a starting point in the present or future: ab nächster Woche (starting next week).
    examples:
      - "Vor dem Unterricht trinke ich einen Kaffee."
      - "Wir sind vor drei Wochen umgezogen."
      - "Ich lerne seit sechs Monaten Deutsch und spreche es schon gut."
      - "Ab dem 1. August gelten neue Fahrpreise."
    exercises:
      - type: fill_blank
        textWithBlank: "Er wohnt schon ___ einem Jahr in Frankfurt und fühlt sich wohl. (since/for)"
        correctAnswer: "seit"
      - type: multiple_choice
        question: "Welche Präposition drückt ein vergangenes Ereignis aus? 'Ich habe ___ zwei Stunden angerufen.'"
        options: ["vor", "nach", "ab", "seit"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "___ der Arbeit gehe ich direkt ins Fitnessstudio. (after / dative fem: der)"
        correctAnswer: "Nach"
      - type: flashcard
        front: "vor einem Monat (Dativ)"
        back: "a month ago"

  - slug: vocab-travel-transportation
    skill: vocabulary
    title: "Travel, Railway Stations, and Airports"
    prerequisites: []
    explanation: |
      Traveling in German-speaking countries requires vocabulary for booking, boarding, and managing delays.
      Key terms include: die Fahrkarte / das Ticket (ticket), der Bahnsteig (platform), das Gleis (track), die Abfahrt (departure), die Ankunft (arrival), and der Flug (flight).
      Important verbs include umsteigen (to transfer/change trains), einsteigen (to board), aussteigen (to exit/alight), and stornieren (to cancel).
    examples:
      - "Der Intercity nach Hamburg steht an Gleis 3 bereit."
      - "Müssen wir in Hannover umsteigen oder fährt der Zug durch?"
      - "Ich möchte eine einfache Fahrkarte nach Köln kaufen."
      - "Der Flug hat leider 45 Minuten Verspätung."
    exercises:
      - type: flashcard
        front: "umsteigen (steigt um, ist umgestiegen)"
        back: "to transfer / change trains or buses"
      - type: multiple_choice
        question: "Wo wartet man auf den Zug?"
        options: ["Am Bahnsteig", "Im Kofferraum", "Am Schalter", "An der Kasse"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Fahrgäste bitte ___ ! Die Türen schließen automatisch. (board/step in)"
        correctAnswer: "einsteigen"
      - type: free_text
        prompt: "Ask whether you need to change trains on the journey to Munich."
        modelAnswer: "Muss ich auf dem Weg nach München umsteigen?"

  - slug: vocab-housing-furniture
    skill: vocabulary
    title: "Living Spaces, Rooms, and Household Furniture"
    prerequisites: []
    explanation: |
      Describing apartments and homes involves specific terminology for rooms, fixtures, and household furnishings.
      Rooms include: das Wohnzimmer (living room), das Schlafzimmer (bedroom), die Küche (kitchen), and das Badezimmer (bathroom).
      Furniture items include: der Schrank (wardrobe/cupboard), das Regal (shelf), der Schreibtisch (desk), der Teppich (carpet), and die Waschmaschine (washing machine).
    examples:
      - "In meinem Schlafzimmer stehen ein großes Bett und ein Schrank."
      - "Die Küche hat einen Kühlschrank, einen Herd und eine Spülmaschine."
      - "Der Schreibtisch steht direkt vor dem Fenster im Arbeitszimmer."
      - "Wir suchen eine moderne 3-Zimmer-Wohnung mit Balkon."
    exercises:
      - type: flashcard
        front: "der Kühlschrank"
        back: "the refrigerator"
      - type: multiple_choice
        question: "In welchem Zimmer schläft man normalerweise?"
        options: ["Im Schlafzimmer", "In der Küche", "Im Flur", "Im Badezimmer"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Ich hänge meine Kleider in den großen ___ . (wardrobe: der Schrank)"
        correctAnswer: "Schrank"
      - type: free_text
        prompt: "Describe what furniture is in your living room."
        modelAnswer: "In meinem Wohnzimmer stehen ein bequemes Sofa, ein Fernseher und ein Tisch."

  - slug: vocab-body-health-illness
    skill: vocabulary
    title: "Body Parts, Illnesses, and Healthcare"
    prerequisites: []
    explanation: |
      Talking about health problems involves naming parts of the body and describing symptoms accurately.
      Body parts include: der Kopf (head), der Hals (neck/throat), der Rücken (back), der Bauch (stomach), das Bein (leg), and der Arm (arm).
      Symptoms are described with compound nouns like Halsschmerzen (sore throat), Fieber (fever), Husten (cough), and Schnupfen (runny nose).
    examples:
      - "Ich habe seit drei Tagen hohes Fieber und starken Husten."
      - "Mein Rücken tut nach dem Sport sehr weh."
      - "Der Arzt hat mir ein Rezept für Tabletten gegeben."
      - "Gute Besserung! Ruh dich gut aus."
    exercises:
      - type: flashcard
        front: "Gute Besserung!"
        back: "Get well soon!"
      - type: multiple_choice
        question: "Was hat man, wenn die Stirn sehr heiß ist und man über 38,5 Grad Temperatur hat?"
        options: ["Fieber", "Husten", "Schnupfen", "Bauchschmerzen"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Mein ___ tut weh, ich kann kaum schlucken. (throat/neck: der Hals)"
        correctAnswer: "Hals"
      - type: free_text
        prompt: "Say that you cannot come to work today because you have a headache."
        modelAnswer: "Ich kann heute nicht zur Arbeit kommen, weil ich starke Kopfschmerzen habe."

  - slug: vocab-clothing-shopping
    skill: vocabulary
    title: "Clothing, Sizes, Colors, and Shopping"
    prerequisites: []
    explanation: |
      Shopping for clothes requires expressing preferences for styles, fits, sizes, and colors.
      Garments include: die Hose (pants), das Hemd (dress shirt), die Jacke (jacket), der Pullover (sweater), and die Schuhe (shoes, pl.).
      Key adjectives and transactional terms include: die Größe (size), anprobieren (to try on), eng (tight), weit (loose), and passen (to fit).
    examples:
      - "Kann ich diese schwarze Jacke in Größe M anprobieren?"
      - "Die Hose ist mir leider zu weit, haben Sie eine kleinere Größe?"
      - "Das blaue Hemd steht dir ausgezeichnet."
      - "Wo finde ich die Umkleidekabinen?"
    exercises:
      - type: flashcard
        front: "anprobieren (probiert an)"
        back: "to try on (clothes)"
      - type: multiple_choice
        question: "Wo probiert man im Bekleidungsgeschäft Kleidung an?"
