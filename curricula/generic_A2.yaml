  - slug: reading-travel-itineraries
    skill: reading
    title: "Reading Travel Itineraries and Hotel Information"
    prerequisites: [vocab-travel-transportation, perfekt-haben-regular]
    explanation: |
      Reading travel itineraries and booking confirmations at A2 requires extracting operational details such as dates, departure times, check-in rules, and included meals.
      Look for headings like 'Buchungsbestätigung' (booking confirmation), 'Inklusive' (included), and 'Stornierungsbedingungen' (cancellation policies).
    examples:
      - "Hotel Alpenrose: Ihr Zimmer steht Ihnen am Anreisetag ab 15:00 Uhr zur Verfügung. Das Frühstücksbuffet servieren wir von 7:00 bis 10:30 Uhr."
      - "Reiseplan: Abfahrt München Hbf um 08:34 Uhr von Gleis 11. Ankunft Salzburg Hbf um 10:12 Uhr. Kein Umstieg erforderlich."
    exercises:
      - type: multiple_choice
        question: "Text: 'Hotel Central: Check-in ab 14:00 Uhr, Check-out bis spätestens 11:00 Uhr. Rezeption 24 Stunden besetzt.' - Wann muss man spätestens das Zimmer verlassen?"
        options: ["Um 11:00 Uhr", "Um 14:00 Uhr", "Um 24:00 Uhr", "Jederzeit"]
        correctIndex: 0
      - type: multiple_choice
        question: "Text: 'Fahrkarte gültig für 2 Erwachsene und bis zu 3 Kinder unter 14 Jahren am Samstag ganztägig.' - Wer darf mit dieser Karte reisen?"
        options: [
          "Fünf Erwachsene",
          "Zwei Erwachsene mit maximal drei Kindern",
          "Nur Jugendliche",
          "Eine Gruppe von zehn Personen"
        ]
        correctIndex: 1
      - type: free_text
        prompt: "Text: 'Frühstück ist im Zimmerpreis enthalten und wird im Erdgeschoss serviert.' - Does breakfast cost extra?"
        modelAnswer: "Nein, das Frühstück ist im Preis enthalten."

  - slug: reading-short-news-reports
    skill: reading
    title: "Reading Short News Reports and Local Announcements"
    prerequisites: [praeteritum-sein-haben, subordinate-clauses-weil-dass]
    explanation: |
      Newspaper snippets, municipal notices, and public interest stories communicate core facts using a combination of present, past, and passive constructions.
      Focus on answering the fundamental journalism questions: Wer? (Who?), Was? (What?), Wann? (When?), and Wo? (Where?).
    examples:
      - "Gestern Abend ereignete sich auf der Autobahn A1 ein schwerer Unfall. Wegen der Aufräumarbeiten war die Straße für drei Stunden voll gesperrt."
      - "Die Stadtbibliothek eröffnet am kommenden Samstag eine neue Abteilung für digitale Medien. Der Eintritt ist am ersten Wochenende frei."
    exercises:
      - type: multiple_choice
        question: "Text: 'Wegen Bauarbeiten fahren die Züge der Linie U2 ab Montag nicht zwischen Hauptbahnhof und Zoo. Es gibt einen Ersatzverkehr mit Bussen.' - Wie fahren die Fahrgäste zwischen Hbf und Zoo?"
        options: ["Mit der U2", "Mit dem Fahrrad", "Mit dem Bus", "Gar nicht"]
        correctIndex: 2
      - type: multiple_choice
        question: "Text: 'Am Wochenende feierte das Museum für Naturkunde sein 50-jähriges Bestehen mit über 5.000 Besuchern.' - Was wurde gefeiert?"
        options: ["Eine Neueröffnung", "Ein 50. Jubiläum", "Ein Stadtfest", "Ein Konzert"]
        correctIndex: 1
      - type: free_text
        prompt: "Text: 'Wegen eines Feiertags bleiben alle städtischen Ämter am Freitag geschlossen.' - Why are the offices closed on Friday?"
        modelAnswer: "Wegen eines Feiertags bleiben sie geschlossen."

  - slug: listening-weather-traffic-announcements
    skill: listening
    title: "Understanding Weather Bulletins and Traffic Reports"
    prerequisites: [vocab-travel-transportation]
    explanation: |
      Weather forecasts and traffic announcements on the radio follow standardized structures.
      Traffic bulletins report accidents (Unfall), road closures (Sperrung), and traffic jams (Stau) with precise kilometer lengths and road numbers (z.B. A3, B10).
      Weather reports describe temperatures (Grad Celsius), precipitation (Regen, Schnee), and sunshine.
    examples:
      - "Verkehrsmeldung: Auf der A8 München Richtung Salzburg fünf Kilometer Stau nach einem Unfall."
      - "Das Wetter morgen: Im Norden heiter bis wolkig bei Höchstwerten um 22 Grad, im Süden am Nachmittag Gewitter."
    exercises:
      - type: multiple_choice
        question: "Radiomeldung: 'A3 Frankfurt Richtung Köln zwischen Limburg und Montabaur: 10 Kilometer Stau wegen einer Baustelle.' - Warum gibt es Stau?"
        options: ["Wegen eines Unfalls", "Wegen einer Baustelle", "Wegen Glatteis", "Wegen eines Streiks"]
        correctIndex: 1
      - type: multiple_choice
        question: "Wetterbericht: 'Morgen im ganzen Land sonnig und trocken bei angenehmen 24 Grad.' - Wie wird das Wetter?"
        options: ["Es regnet stark", "Es wird kalt", "Es gibt Sonne und keine Niederschläge", "Es stürmt"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Durchsage: 'Achtung Autofahrer: Auf der A7 liegt ein Reifen auf der Fahrbahn. Bitte fahren Sie ___ !' (carefully/slowly)"
        correctAnswer: "vorsichtig"

  - slug: listening-conversations-past-events
    skill: listening
    title: "Listening to Conversations about Past Vacations and Activities"
    prerequisites: [perfekt-haben-regular, perfekt-sein-movement]
    explanation: |
      Everyday conversations frequently involve friends or coworkers recounting what they did over the weekend or during their holidays.
      Listen for Perfekt constructions, temporal indicators (gestern, letztes Wochenende, vor einem Monat), and emotional evaluations (toll, anstrengend, langweilig).
    examples:
      - "Dialog: 'Wie war dein Urlaub in Italien?' - 'Fantastisch! Wir haben jeden Tag am Strand gelegen und leckere Pasta gegessen.'"
      - "Dialog: 'Hast du am Samstag Peter getroffen?' - 'Nein, Peter war krank. Ich bin alleine ins Kino gegangen.'"
    exercises:
      - type: multiple_choice
        question: "Gespräch: 'Hallo Julia, hast du am Wochenende deine Eltern besucht?' - 'Nein, ich hatte so viel zu tun, ich habe nur geputzt und eingekauft.' - Was hat Julia gemacht?"
        options: [
          "Sie hat ihre Eltern besucht.",
          "Sie ist verreist.",
          "Sie hat geputzt und eingekauft.",
          "Sie war im Theater."
        ]
        correctIndex: 2
      - type: multiple_choice
        question: "Gespräch: 'Wie war das Konzert am Freitag?' - 'Die Band hat super gespielt, aber die Akustik in der Halle war leider sehr schlecht.' - Wie fand der Sprecher das Konzert insgesamt?"
        options: [
          "Die Musik war gut, aber der Ton in der Halle war schlecht.",
          "Die Band war schrecklich.",
          "Er konnte gar nicht hingehen.",
          "Es war perfekt ohne Probleme."
        ]
        correctIndex: 0
      - type: free_text
        prompt: "Spoken text: 'Wir sind im Urlaub zwei Wochen durch Norwegen gewandert.' - Where did they spend their vacation?"
        modelAnswer: "In Norwegen."

  - slug: writing-informal-email-vacation
    skill: writing
    title: "Composing an Informal Email about Past Events"
    prerequisites: [perfekt-haben-regular, subordinate-clauses-weil-dass]
    explanation: |
      Writing an informal email about personal experiences requires greeting the recipient, describing events using the Perfekt, giving emotional reactions, and ending with an inquiry about the friend's life.
      Ensure correct sentence connectors (und, aber, weil) and punctuation.
    examples:
      - "Lieber Paul, ich bin gerade aus dem Urlaub in Wien zurückgekommen. Die Stadt hat mir sehr gut gefallen, weil die Museen wunderschön waren. Wir haben viel Kaffee getrunken. Wie geht es dir? Herzliche Grüße, Stefan."
    exercises:
      - type: free_text
        prompt: "Write a short email (approx. 35 words) to a friend about your last weekend. State where you went and what you did."
        modelAnswer: "Liebe Laura, am Wochenende bin ich mit dem Zug nach Hamburg gefahren. Ich habe den Hafen besucht und mit Freunden Fischbrötchen gegessen. Das Wetter war herrlich. Was hast du gemacht? Viele Grüße, Julia."
      - type: fill_blank
        textWithBlank: "Liebe Julia, danke ___ deine schöne Postkarte aus Italien."
        correctAnswer: "für"
      - type: multiple_choice
        question: "Welche Grußformel ist typisch für eine informelle Nachricht an einen guten Freund?"
        options: [
          "Sehr geehrter Herr Direktor,",
          "Mit freundlichen Grüßen,",
          "Liebe Grüße / Dein(e),",
          "Hochachtungsvoll,"
        ]
        correctIndex: 2

  - slug: speaking-reporting-past-weekend
    skill: speaking
    title: "Speaking: Reporting Past Activities and Weekend Plans"
    prerequisites: [perfekt-haben-regular, perfekt-sein-movement]
    explanation: |
      To converse fluently at A2, learners must produce connected sentences describing what they did recently and what they intend to do next.
      Use temporal sequence markers such as zuerst (first), danach / dann (then), später (later), and schließlich (finally) to structure your monologue.
    examples:
      - "Am Samstag habe ich zuerst lange geschlafen. Danach habe ich eingekauft und am Nachmittag habe ich Freunde getroffen."
      - "Am Sonntag bin ich im Wald spazieren gegangen, weil das Wetter sehr schön war."
    exercises:
      - type: free_text
        prompt: "Tell your conversation partner in two sentences what you did last Sunday."
        modelAnswer: "Am Sonntag habe ich ein Buch gelesen und am Nachmittag habe ich meine Großeltern besucht."
      - type: free_text
        prompt: "Describe what you plan to do next weekend using 'am Wochenende'."
        modelAnswer: "Am Wochenende möchte ich mit meinen Freunden grillen und ins Kino gehen."
      - type: multiple_choice
        question: "Welches Wort verbindet Sätze zeitlich in der richtigen Reihenfolge?"
        options: ["Zuerst", "Weil", "Dass", "Obwohl"]
        correctIndex: 0