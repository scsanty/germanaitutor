  - slug: sachtexte-global-detailverstehen
    skill: reading
    title: "Leseverstehen: Sachtexte global und selektiv erschließen"
    prerequisites: [passiv-alternativen, partizipialattribute]
    explanation: |
      Bei anspruchsvollen Sachtexten geht es darum, zwischen Kernaussagen (Globalverstehen), Detailinformationen und impliziten Wertungen zu differenzieren.
      Achten Sie auf Gliederungssignale (z. B. "erstens", "hingegen", "zusammenfassend") und Schlüsselbegriffe im Themenumfeld.
      Lassen Sie sich nicht von unbekannten Fachwörtern verunsichern; leiten Sie deren Bedeutung aus dem Kontext oder der Wortbildung ab.
    examples:
      - "Textauszug: 'Obwohl die Pilotstudie methodische Schwächen aufweist, liefert sie wertvolle Hinweise auf das geänderte Nutzerverhalten.'"
      - "Frage zum Text: Welche Einschränkung nennt der Autor hinsichtlich der Aussagekraft der Untersuchung?"
    exercises:
      - type: multiple_choice
        question: "Text: 'Entgegen früheren Annahmen hat die Digitalisierung nicht zum papierlosen Büro geführt. Vielmehr stieg der Papierverbrauch in vielen Verwaltungen zunächst an, da Entwürfe mehrfach ausgedruckt wurden.' - Was trifft laut Text zu?"
        options:
          - "Das papierlose Büro hat sich sofort überall durchgesetzt."
