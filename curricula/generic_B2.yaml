      - type: free_text
        prompt: "Notieren Sie die Kernbotschaft: 'Ohne eine gezielte Modernisierung unserer Schulen werden wir den Anschluss an führende Technologienationen unausweichlich verlieren.'"
        modelAnswer: "Schulen müssen modernisiert werden, um technologisch konkurrenzfähig zu bleiben."

  - slug: stellungnahme-erlaeuterung-verfassen
    skill: writing
    title: "Schriftlicher Ausdruck: Strukturierte Stellungnahme und Erörterung"
    prerequisites: [zweiteilige-konnektoren, nominalisierung-verbalisierung]
    explanation: |
      Eine fundierte Stellungnahme (dialektische Erörterung) gliedert sich klassisch in:
      1. Einleitung: Thema aufgreifen, Relevanz darlegen, Fragestellung präzisieren.
      2. Hauptteil: Gegenargumente entkräften (Gegenseite beleuchten) und eigene Argumente steigernd darlegen (These, Begründung, konkretes Beispiel).
      3. Verknüpfungen: Konnektoren wie "darüber hinaus", "demgegenüber ist einzuwenden", "zwar ... jedoch" nutzen.
      4. Schlussteil: Abwägendes Fazit ziehen und eventuell einen Kompromiss oder Ausblick formulieren.
    examples:
      - "Einleitung: 'In der aktuellen Debatte wird immer wieder die Frage aufgeworfen, ob...'"
      - "Überleitung: 'Befürworter dieser Maßnahme führen häufig an, dass... Demgegenüber muss jedoch betont werden, dass...'"
      - "Fazit: 'Unter Abwägung aller Argumente überwiegen meines Erachtens die Vorteile...'"
    exercises:
      - type: free_text
        prompt: "Verfassen Sie eine Einleitung (ca. 30–40 Wörter) zu einer Stellungnahme über das Thema 'Homeoffice zur Pflicht für Unternehmen machen'."
        modelAnswer: "Die Frage, ob Arbeitgeber gesetzlich dazu verpflichtet werden sollten, Homeoffice anzubieten, wird kontrovers diskutiert. Angesichts der fortschreitenden Digitalisierung und veränderter Lebensentwürfe gewinnt diese Debatte zunehmend an gesellschaftlicher Relevanz."
      - type: multiple_choice
        question: "Welche Redewendung eignet sich am besten, um ein Gegenargument einzuführen?"
        options:
          - "Ein weiteres Beispiel hierfür ist..."
          - "Dem steht allerdings das gewichtige Argument gegenüber, dass..."
          - "Zusammenfassend lässt sich feststellen, dass..."
          - "Zuerst möchte ich erwähnen, dass..."
        correctIndex: 1

  - slug: beschwerdebrief-dienstleistung
    skill: writing
    title: "Schriftlicher Ausdruck: Formelle Mängelrüge und Beschwerde"
    prerequisites: [passiv-modalverben, konjunktiv-ii-vergangenheit]
    explanation: |
      Ein formeller Beschwerdebrief erfordert einen sachlichen, aber nachdrücklichen Tonfall im gehobenen Register.
      Wichtige Bestandteile:
      - Betreffzeile mit Bezugsnummer / Buchungsnummer.
      - Höfliche, formelle Anrede ("Sehr geehrte Damen und Herren,").
      - Präzise Schilderung des Soll- und Ist-Zustands anhand konkreter Vorfälle.
      - Fristsetzung zur Nachbesserung, Rückerstattung oder Stellungnahme.
      - Ankündigung rechtlicher Schritte bei Fristversäumnis.
    examples:
      - "Betreff: Beschwerde über den gebuchten Sprachkurs – Rechnungsnummer 45982"
      - "Entgegen den Zusagen in Ihrem Prospekt fand der Unterricht nicht mit muttersprachlichen Dozenten statt."
      - "Ich fordere Sie hiermit auf, mir bis zum 15. November einen Teilbetrag von 30 % zu erstatten."
    exercises:
      - type: free_text
        prompt: "Formulieren Sie einen Schlusssatz mit Fristsetzung für einen Beschwerdebrief an ein Reiseunternehmen."
        modelAnswer: "Ich erwarte Ihre schriftliche Stellungnahme sowie die Rückerstattung des genannten Betrags bis spätestens zum 24. Oktober."
      - type: fill_blank
        textWithBlank: "Sollten Sie die Frist verstreichen lassen, sehe ich mich gezwungen, rechtliche Schritte einzu___ ."
        correctAnswer: "leiten"

  - slug: pro-kontra-diskussion-fuehren
    skill: speaking
    title: "Mündlicher Ausdruck: Argumentieren, Nuancieren und Einwände entkräften"
    prerequisites: [zweiteilige-konnektoren, nomen-verb-verbindungen-basis]
    explanation: |
      In einer Diskussion auf B2-Niveau müssen Sprecher flexibel auf Beiträge reagieren, den eigenen Standpunkt präzisieren und Widerspruch höflich, aber bestimmt formulieren.
      Redemittel zur Zustimmung mit Einschränkung: "Dem stimme ich im Prinzip zu, allerdings...", "Da haben Sie sicher recht, dennoch sollte man bedenken, dass...".
      Redemittel zum Widerspruch: "Das sehe ich grundlegend anders.", "Diesem Argument möchte ich mit aller Entschiedenheit widersprechen.", "Erlauben Sie mir dazu eine kritische Anmerkung."
    examples:
      - "Ich verstehe Ihren Punkt vollkommen, bezweifle jedoch, dass diese Maßnahme finanzierbar ist."
      - "Man darf hierbei keinesfalls die sozialen Folgen für einkommensschwache Familien außer Acht lassen."
      - "Darf ich an dieser Stelle kurz einhaken und ein konkretes Gegenbeispiel anführen?"
    exercises:
      - type: multiple_choice
        question: "Welche Formulierung drückt höflichen, aber entschiedenen Widerspruch aus?"
        options:
          - "Das ist mir völlig egal."
          - "Da bin ich ganz Ihrer Ansicht."
          - "Da muss ich Ihnen leider widersprechen, denn die Faktenlage zeigt ein anderes Bild."
          - "Vielleicht haben Sie recht, vielleicht auch nicht."
        correctIndex: 2
      - type: free_text
        prompt: "Reagieren Sie auf folgende Aussage: 'Universitätsbildung sollte für alle kostenpflichtig sein.' Äußern Sie fundierten Widerspruch mit Begründung."
        modelAnswer: "Dem muss ich vehement widersprechen. Studiengebühren würden die soziale Spaltung vertiefen und Talenten aus benachteiligten Familien den Hochschulzugang versperren."

  - slug: fachpraesentation-strukturieren
    skill: speaking
    title: "Mündlicher Ausdruck: Aufbau und Halten eines Fachreferats"
    prerequisites: [nomen-verb-verbindungen-basis]
    explanation: |
      Ein strukturierter Vortrag erfordert eine transparente Gliederung und klare Moderationsphrasen:
      1. Einleitung: Begrüßung, Thema nennen, Aufbau kurz umreißen ("In meinem heutigen Vortrag widme ich mich der Frage... Dazu gliedert sich mein Beitrag in drei Teile.").
      2. Hauptteil: Übergänge zwischen Punkten markieren ("Nachdem ich die Ursachen erläutert habe, komme ich nun zu den Lösungsansätzen.").
      3. Schluss: Zusammenfassung der Kernaussage, Danksagung und Eröffnung der Fragerunde ("Abschließend möchte ich festhalten... Ich danke Ihnen für Ihre Aufmerksamkeit und freue mich auf Ihre Fragen.").
    examples:
      - "Der Zweck meiner heutigen Präsentation besteht darin, Ihnen die Vor- und Nachteile von Remote Work näherzubringen."
      - "Lassen Sie mich diesen Aspekt anhand eines anschaulichen Beispiels verdeutlichen."
      - "Damit bin ich am Ende meines Referats angelangt. Ich stehe Ihnen nun gerne für Fragen zur Verfügung."
    exercises:
      - type: free_text
        prompt: "Formulieren Sie einen Satz zur Ankündigung des zweiten Punkts Ihrer Präsentation nach Abschluss des ersten Punkts."
        modelAnswer: "Nachdem wir uns mit den theoretischen Grundlagen befasst haben, wenden wir uns nun den praktischen Anwendungsbeispielen zu."
      - type: multiple_choice
        question: "Welcher Ausdruck eignet sich am besten für den Abschluss eines formalen Referats?"
        options:
          - "So, das war's eigentlich von meiner Seite."
          - "Ich bedanke mich ganz herzlich für Ihre Aufmerksamkeit und freue mich auf Ihre Rückfragen."
          - "Hoffentlich war das nicht zu langweilig für Sie."
          - "Jetzt können Sie klatschen."
        correctIndex: 1