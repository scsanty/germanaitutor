        modelAnswer: "Die Furcht vor dem Verlust bestehender Arbeitsplätze steht der Hoffnung auf neue Berufsfelder gegenüber."

  - slug: kommentare-standpunkte-erfassen
    skill: reading
    title: "Leseverstehen: Standpunkte und Ironie in Kommentaren erkennen"
    prerequisites: [zweiteilige-konnektoren]
    explanation: |
      Leitartikel, Glossen und Essays enthalten oft subjektive Wertungen, rhetorische Fragen und sprachliche Nuancen wie Ironie oder Distanzierung.
      Achten Sie auf Modalpartikeln ("ja", "doch", "wohl"), Konjunktiv I zur Redewiedergabe ("sei", "habe behauptet") und wertende Adjektive ("fragwürdig", "scheinbar", "angeblich").
    examples:
      - "Text: 'Dass diese halbherzigen Maßnahmen die Klimakatastrophe abwenden sollen, ist mehr als zweifelhaft.'"
      - "Text: 'Der Minister feiert die Reform als Meilenstein – ein Blick auf die Zahlen offenbart jedoch ein Desaster.'"
    exercises:
      - type: multiple_choice
        question: "Text: 'Angeblich garantiert die neue App absolute Sicherheit vor Hackerangriffen. Doch schon wenige Stunden nach Veröffentlichung meldeten Sicherheitsexperten bedenkliche Schwachstellen.' - Welche Haltung hat der Autor?"
        options:
          - "Er ist von der Zuverlässigkeit der App voll überzeugt."
          - "Er bezweifelt die Versprechen des Herstellers massiv."
          - "Er empfiehlt den Kauf der Software uneingeschränkt."
          - "Er ignoriert die Berichte der Sicherheitsexperten."
        correctIndex: 1
      - type: free_text
        prompt: "Erklären Sie die Bedeutung des Wortes 'scheinbar' im Kontrast zu 'anscheinend' in einem journalistischen Text."
        modelAnswer: "'Scheinbar' drückt aus, dass etwas nur so aussieht, in Wirklichkeit aber nicht so ist. 'Anscheinend' bedeutet, dass eine Vermutung wahrscheinlich zutrifft."

  - slug: fachvortraege-podcasts-verstehen
    skill: listening
    title: "Hörverstehen: Fachvorträge und Diskussionsbeiträge"
    prerequisites: [passiv-formen-zeiten, nominalisierung-verbalisierung]
    explanation: |
      Das Verstehen gesprochener Sprache auf B2 erfordert die Erfassung komplexer Gedankengänge bei normaler Sprechgeschwindigkeit.
      Konzentrieren Sie sich auf Einleitungsphrasen ("Ich möchte nun auf den nächsten Punkt eingehen"), Hervorhebungen ("Besonders hervorzuheben ist...") und Schlussfolgerungen ("Daraus ergibt sich folgendes Fazit").
      Filtern Sie störende Füllwörter mental heraus und notieren Sie beim Hören prägnante Stichwörter.
    examples:
      - "Hörtext: 'Zusammenfassend lässt sich konstatieren, dass die Investition in Weiterbildung langfristig zu höherer Produktivität führt.'"
      - "Hörtext: 'Bevor wir zur Fragerunde übergehen, möchte ich noch kurz die zentralen Thesen meines Vortrags rekapitulieren.'"
    exercises:
      - type: multiple_choice
        question: "Sprecher: 'Man darf nicht übersehen, dass die Kosten für Solaranlagen zwar drastisch gesunken sind, die Speicherkapazitäten jedoch nach wie vor einen Engpass darstellen.' - Worin besteht das verbleibende Hauptproblem?"
        options:
          - "In den extrem hohen Anschaffungskosten für Solarmodule."
          - "In der mangelnden gesellschaftlichen Akzeptanz von Solarenergie."
          - "In den unzureichenden Möglichkeiten zur Speicherung des erzeugten Stroms."
          - "Im Mangel an ausgebildeten Handwerkern."
