track: generic
level: A1

lessons:
  - slug: personal-pronouns
    skill: grammar
    title: Personal Pronouns in the Nominative
    prerequisites: []
    explanation: |
      In German, personal pronouns represent the subject of the clause in the nominative case.
      They change according to grammatical person, number, and formal politeness.
      The basic forms are: ich (I), du (you, informal singular), er (he), sie (she), es (it), wir (we), ihr (you, informal plural), sie (they), and Sie (you, formal singular and plural).
      Notice that formal Sie is always capitalized.
    examples:
      - "Ich komme aus Spanien."
      - "Du lernst Deutsch."
      - "Wir wohnen in Berlin."
      - "Sie sind Herr Müller, richtig?"
    exercises:
      - type: multiple_choice
        question: "Welches Pronomen ersetzt 'Peter'? '___ wohnt in Hamburg.'"
        options: ["Er", "Sie", "Es", "Wir"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Hallo Sarah! Lernst ___ auch Deutsch?"
        correctAnswer: "du"
      - type: flashcard
        front: "ihr (informal plural)"
        back: "you all / you guys"
      - type: free_text
        prompt: "State which country you come from using 'ich'."
        modelAnswer: "Ich komme aus Italien."

  - slug: regular-verbs-present
    skill: grammar
    title: Regular Verb Conjugation in Present Tense
    prerequisites: [personal-pronouns]
    explanation: |
      German regular verbs are conjugated in the present tense by removing the infinitive ending -en and adding person-specific endings to the verb stem.
      The endings are: ich -e, du -st, er/sie/es -t, wir -en, ihr -t, and sie/Sie -en.
      For example, the verb lernen has the stem lern-, yielding ich lerne, du lernst, and er lernt.
      Verbs ending in -ten or -den (like arbeiten) insert an extra -e- before endings for easier pronunciation (du arbeitest).
    examples:
      - "Ich lerne jeden Tag Deutsch."
      - "Du machst deine Hausaufgaben."
      - "Er spielt am Samstag Fußball."
      - "Wir trinken gerne Kaffee."
    exercises:
      - type: fill_blank
        textWithBlank: "Maria ___ in München. (wohnen)"
        correctAnswer: "wohnt"
      - type: multiple_choice
        question: "Welche Form ist korrekt? 'Ihr ___ sehr schnell.'"
        options: ["lernst", "lernt", "lernen", "lerne"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wir ___ heute eine Suppe. (kochen)"
        correctAnswer: "kochen"
      - type: flashcard
        front: "du machst"
        back: "you do / you make"

  - slug: verb-sein-haben
    skill: grammar
    title: The Irregular Auxiliaries Sein and Haben
    prerequisites: [personal-pronouns]
    explanation: |
      The verbs sein (to be) and haben (to have) are highly irregular and essential for basic communication.
      The conjugation of sein is: ich bin, du bist, er/sie/es ist, wir sind, ihr seid, sie/Sie sind.
      The conjugation of haben is: ich habe, du hast, er/sie/es hat, wir haben, ihr habt, sie/Sie haben.
      These verbs express identity, states of being, age, possession, and physical conditions.
    examples:
      - "Ich bin 25 Jahre alt."
      - "Er ist Arzt von Beruf."
      - "Wir haben eine große Wohnung."
      - "Hast du Geschwister?"
    exercises:
      - type: fill_blank
        textWithBlank: "Das ___ mein Kollege, Herr Schneider."
        correctAnswer: "ist"
      - type: multiple_choice
        question: "Welche Form von 'haben' passt? 'Ihr ___ viel Glück.'"
        options: ["hast", "hat", "habt", "haben"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Ich ___ müde und gehe schlafen."
        correctAnswer: "bin"
      - type: flashcard
        front: "wir sind"
        back: "we are"

  - slug: alphabet-greetings-numbers
    skill: vocabulary
    title: Alphabet, Greetings, and Numbers 0 to 100
    prerequisites: []
    explanation: |
      Basic interactions begin with greetings, farewells, spelling names, and reciting numbers.
      Common greetings include 'Guten Morgen' (morning), 'Guten Tag' (daytime), and 'Hallo' (informal).
      Farewells include 'Auf Wiedersehen' (formal) and 'Tschüss' (informal).
      German numbers from 21 to 99 are inverted, stating the unit before the ten joined by 'und' (einundzwanzig = 21).
    examples:
      - "Guten Tag, wie heißen Sie?"
      - "Mein Name ist Weber, W-E-B-E-R."
      - "Ich bin 32 (zweiunddreißig) Jahre alt."
      - "Auf Wiedersehen, bis morgen!"
    exercises:
      - type: flashcard
        front: "Guten Abend"
        back: "Good evening"
      - type: multiple_choice
        question: "Was bedeutet die Zahl 'dreiundvierzig'?"
        options: ["34", "43", "403", "304"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wie bitte? Können Sie Ihren Nachnamen ___? (to spell)"
        correctAnswer: "buchstabieren"
      - type: free_text
        prompt: "Write a short German farewell to an acquaintance."
        modelAnswer: "Auf Wiedersehen!"

  - slug: definite-indefinite-articles
    skill: grammar
    title: Definite and Indefinite Articles in Nominative
    prerequisites: []
    explanation: |
      Every German noun has an inherent grammatical gender: masculine (der), feminine (die), or neuter (das).
      The plural for all genders in the nominative is die.
      The indefinite article (a/an) is ein for masculine and neuter, and eine for feminine; there is no plural indefinite article.
      Negative articles follow this pattern: kein (masculine/neuter), keine (feminine/plural).
    examples:
      - "Der Tisch ist neu."
      - "Das ist ein Buch und das ist eine Lampe."
      - "Die Kinder spielen im Garten."
      - "Das ist kein Problem."
    exercises:
      - type: multiple_choice
        question: "Welcher bestimmte Artikel gehört zu 'Frau'?"
        options: ["der", "die", "das", "den"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Hier steht ___ Auto. (neuter, indefinite)"
        correctAnswer: "ein"
      - type: fill_blank
        textWithBlank: "Das ist ___ Stuhl, sondern ein Tisch. (masculine negative)"
        correctAnswer: "kein"
      - type: flashcard
        front: "das Buch / die Bücher"
        back: "the book / the books"

  - slug: sentence-structure-w-questions
    skill: grammar
    title: Word Order in Declarative Sentences and Questions
    prerequisites: [regular-verbs-present]
    explanation: |
      German main clauses follow the verb-second (V2) rule: the conjugated finite verb is always the second element.
      If a temporal or locational element starts the sentence, the subject inverts and follows the verb.
      Information questions begin with an interrogative word (W-Wort: Wer, Was, Wo, Wohin, Woher, Wann, Wie), followed immediately by the verb.
      Yes/No questions (Ja/Nein-Fragen) place the conjugated verb in the first position.
    examples:
      - "Ich trinke heute Tee."
      - "Heute trinke ich Tee."
      - "Woher kommst du?"
      - "Wohnst du in Köln?"
    exercises:
      - type: multiple_choice
        question: "Welche Satzstellung ist korrekt?"
        options: [
          "Morgen ich fahre nach Berlin.",
          "Morgen fahre ich nach Berlin.",
          "Morgen fahre nach Berlin ich.",
          "Ich morgen fahre nach Berlin."
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "___ wohnen Sie? - In München."
        correctAnswer: "Wo"
      - type: free_text
        prompt: "Form a polar (Yes/No) question using the verb 'trinken' and 'Kaffee'."
        modelAnswer: "Trinkst du Kaffee?"

  - slug: daily-routine-vocabulary
    skill: vocabulary
    title: Time, Days of the Week, and Daily Routine
    prerequisites: [alphabet-greetings-numbers]
    explanation: |
      Expressing daily routines requires terms for the days of the week, parts of the day, and clock times.
      The days of the week use the preposition 'am' (am Montag, am Dienstag, am Wochenende).
      Clock times use 'um' (um 8 Uhr, um halb neun = 8:30).
      Key routine activities include frühstücken (to eat breakfast), schlafen (to sleep), and anfangen (to begin).
    examples:
      - "Am Montag arbeite ich von acht bis fünf Uhr."
      - "Der Kurs beginnt um halb zehn."
      - "Am Wochenende schlafe ich lange."
      - "Wann frühstückst du normalerweise?"
    exercises:
      - type: flashcard
        front: "halb acht (7:30)"
        back: "half past seven (7:30)"
      - type: multiple_choice
        question: "Welche Präposition nutzt man für Wochentage? '___ Freitag gehe ich ins Kino.'"
        options: ["Um", "Im", "Am", "Von"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Der Film beginnt ___ 20:00 Uhr."
        correctAnswer: "um"
      - type: free_text
        prompt: "State at what time you wake up using 'um'."
        modelAnswer: "Ich stehe um sieben Uhr auf."

  - slug: accusative-case-articles
    skill: grammar
    title: The Accusative Case Direct Object
    prerequisites: [definite-indefinite-articles]
    explanation: |
      The accusative case marks the direct object receiving the action of a transitive verb (e.g., haben, kaufen, suchen, finden).
      Only the masculine singular article changes in the accusative: der becomes den, and ein becomes einen.
      Feminine (die / eine), neuter (das / ein), and plural (die / keine) articles remain identical to their nominative forms.
      Personal pronouns also shift: ich becomes mich, and du becomes dich.
    examples:
      - "Ich kaufe den Tisch."
      - "Er hat einen Bruder und eine Schwester."
      - "Wir suchen ein bequemes Sofa."
      - "Siehst du mich?"
    exercises:
      - type: fill_blank
        textWithBlank: "Ich brauche ___ neuen Laptop. (der Laptop)"
        correctAnswer: "einen"
      - type: multiple_choice
        question: "Welcher Satz enthält einen korrekten Akkusativ?"
        options: [
          "Er kauft der Computer.",
          "Er kauft den Computer.",
          "Er kauft dem Computer.",
          "Er kauft das Computer."
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Hast du ___ Schlüssel gefunden? (der Schlüssel)"
        correctAnswer: "den"
      - type: flashcard
        front: "einen Apfel (Akkusativ maskulin)"
        back: "an apple (direct object)"

  - slug: negation-nicht-kein
    skill: grammar
    title: Negation with Nicht and Kein
    prerequisites: [definite-indefinite-articles]
    explanation: |
      German uses two main words for negation: 'kein' and 'nicht'.
      Use 'kein' to negate nouns accompanied by an indefinite article or nouns with no article.
      'Kein' inflects like the indefinite article (kein, keine, keinen).
      Use 'nicht' to negate verbs, adjectives, adverbs, proper names, and nouns accompanied by definite articles or possessives.
    examples:
      - "Das ist kein Hund, das ist eine Katze."
      - "Ich habe kein Geld."
      - "Ich verstehe den Satz nicht."
      - "Das Restaurant ist heute nicht geöffnet."
    exercises:
      - type: multiple_choice
        question: "Welches Wort passt? 'Wir haben ___ Auto.'"
        options: ["nicht", "kein", "keine", "keinen"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Ich trinke ___ Milch, ich trinke lieber Wasser."
        correctAnswer: "keine"
      - type: fill_blank
        textWithBlank: "Peter kommt heute leider ___ zum Unterricht."
        correctAnswer: "nicht"
      - type: free_text
        prompt: "Formulate a sentence stating that you do not drink beer using 'kein'."
        modelAnswer: "Ich trinke kein Bier."

  - slug: food-shopping-vocabulary
    skill: vocabulary
    title: Food, Groceries, and Shopping
    prerequisites: [definite-indefinite-articles]
    explanation: |
      Shopping for groceries requires knowledge of common food items, units of measurement, and transactional phrasing.
      Common measures include: ein Kilo (a kilo), ein Pfund (500 grams), eine Flasche (a bottle), and eine Packung (a carton/package).
      Key polite transactional phrases include 'Ich möchte bitte...' (I would like...) and 'Was kostet...?' (How much does... cost?).
    examples:
      - "Ich möchte bitte ein Kilo Äpfel."
      - "Was kosten zwei Flaschen Wasser?"
      - "Käse und Brot sind im Angebot."
      - "Ich nehme noch eine Packung Reis, danke."
    exercises:
      - type: flashcard
        front: "die Lebensmittel (pl.)"
        back: "groceries / food items"
      - type: multiple_choice
        question: "Was kauft man in einer Flasche?"
        options: ["Das Brot", "Das Fleisch", "Das Mineralwasser", "Der Käse"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Ich ___ bitte ein Kilo Kartoffeln. (möchte)"
        correctAnswer: "möchte"
      - type: free_text
        prompt: "Ask how much a loaf of bread costs using 'Was kostet...'."
        modelAnswer: "Was kostet das Brot?"

  - slug: separable-verbs
    skill: grammar
    title: Separable-Prefix Verbs in the Present Tense
    prerequisites: [sentence-structure-w-questions]
    explanation: |
      Separable verbs (trennbare Verben) consist of a base verb and a separable prefix (such as ab-, an-, auf-, aus-, ein-, mit-, vor-, zu-).
      In present tense main clauses, the prefix detaches from the conjugated stem and moves to the final position of the clause.
      Common verbs include aufstehen (to get up), einkaufen (to shop), anrufen (to call), and mitbringen (to bring along).
    examples:
      - "Ich stehe jeden Morgen um sechs Uhr auf."
      - "Er kauft am Nachmittag im Supermarkt ein."
      - "Rufst du mich heute Abend an?"
      - "Wir bringen einen Kuchen zur Party mit."
    exercises:
      - type: fill_blank
        textWithBlank: "Wann stehst du sonntags ___?"
        correctAnswer: "auf"
      - type: multiple_choice
        question: "Welcher Satz ist syntaktisch korrekt?"
        options: [
          "Ich einkaufe am Samstag.",
          "Ich kaufe am Samstag ein.",
          "Ich am Samstag einkaufe.",
          "Ein kaufe ich am Samstag."
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Lisa ruft ihre Mutter ___."
        correctAnswer: "an"
      - type: flashcard
        front: "aufstehen (steht... auf)"
        back: "to get up / wake up"

  - slug: modal-verbs-koennen-moechten
    skill: grammar
    title: "Modal Verbs: Können and Möchten"
    prerequisites: [regular-verbs-present]
    explanation: |
      Modal verbs modify the mood or intention of the main action.
      In the present tense, modal verbs conjugate irregularly in the singular and share identical forms for the first and third persons (ich kann, er kann; ich möchte, er möchte).
      The modal verb occupies the V2 position, while the main action verb appears in its infinitive form at the end of the sentence.
      Können denotes ability or possibility; möchten expresses a polite wish or request.
    examples:
      - "Ich kann sehr gut Schwimmen."
      - "Wir können morgen zusammen Deutsch lernen."
      - "Ich möchte einen Kaffee trinken."
      - "Möchten Sie etwas bestellen?"
    exercises:
      - type: multiple_choice
        question: "Welche Form ist korrekt? 'Er ___ gut Gitarre spielen.'"
        options: ["könnt", "kann", "kannst", "können"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wir ___ gerne eine Pizza essen. (möchten)"
        correctAnswer: "möchten"
      - type: fill_blank
        textWithBlank: "___ du mir bitte helfen? (können)"
        correctAnswer: "Kannst"
      - type: free_text
        prompt: "Express that you can speak German using 'können'."
        modelAnswer: "Ich kann Deutsch sprechen."

  - slug: reading-short-messages
    skill: reading
    title: Reading Short Personal Notes and Messages
    prerequisites: [regular-verbs-present, food-shopping-vocabulary]
    explanation: |
      Reading at A1 involves scanning brief personal notes, postcards, SMS messages, and emails.
      Focus on identifying the sender, the recipient, the primary communicative intention, and key details like dates, times, and meeting locations.
    examples:
      - "Lieber Paul, ich bin im Supermarkt. Brauchen wir Milch? Schreib mir schnell! Gruß, Anna."
      - "Hallo Tom, kommst du heute um 18 Uhr zum Sport? Bitte gib mir Bescheid. LG, Markus."
      - "Liebe Kolleginnen, am Freitag feiere ich meinen Geburtstag im Büro. Es gibt Kuchen! Herzliche Grüße, Sabine."
    exercises:
      - type: multiple_choice
        question: "Text: 'Hallo Tim, treffen wir uns heute um 19 Uhr vor dem Kino? Vergiss die Tickets nicht! Julia.' - Wo treffen sich Tim und Julia?"
        options: ["Im Café", "Vor dem Kino", "Am Bahnhof", "Zu Hause"]
        correctIndex: 1
      - type: multiple_choice
        question: "Text: 'Liebe Mama, der Zug hat Verspätung. Ich komme erst um 17:30 Uhr an. Bis später, David.' - Was ist passiert?"
        options: ["David hat den Zug verpasst.", "David kommt pünktlich an.", "Der Zug kommt später an.", "David bleibt zu Hause."]
        correctIndex: 2
      - type: free_text
        prompt: "Based on: 'Liebe Tina, der Kuchen steht in der Küche. Guten Appetit! Lisa.' - Who prepared the cake?"
        modelAnswer: "Lisa hat den Kuchen vorbereitet."

  - slug: listening-public-announcements
    skill: listening
    title: Listening to Public Announcements
    prerequisites: [alphabet-greetings-numbers, daily-routine-vocabulary]
    explanation: |
      Public address announcements in train stations, airports, and retail stores convey concise operational information.
      Learners must listen selectively for key terms such as 'Gleis' (track/platform), 'Verspätung' (delay), 'Achtung' (attention), and opening/closing times.
    examples:
      - "Achtung an Gleis 4: Der Intercity nach Hamburg fährt heute mit 15 Minuten Verspätung ab."
      - "Sehr geehrte Kundinnen und Kunden, unser Geschäft schließt in zehn Minuten. Bitte begeben Sie sich zur Kasse."
      - "Der Flug LH 400 nach New York ist jetzt zum Einsteigen bereit an Flugsteig B12."
    exercises:
      - type: multiple_choice
        question: "Ansage: 'Achtung an Gleis 3: Der Regionalzug nach Köln hat 20 Minuten Verspätung.' - Wie viel Verspätung hat der Zug?"
        options: ["10 Minuten", "20 Minuten", "30 Minuten", "Er ist pünktlich"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Ansage: 'Der Zug fährt heute nicht von Gleis 2, sondern von Gleis ___ ab.' (spoken number: vier)"
        correctAnswer: "4"
      - type: multiple_choice
        question: "Ansage: 'Liebe Kunden, Sonderangebot in der Obstabteilung: Ein Kilo Orangen heute für nur 1 Euro 50.' - Was ist im Angebot?"
        options: ["Äpfel", "Bananen", "Orangen", "Kartoffeln"]
        correctIndex: 2

  - slug: reading-classified-ads-notices
    skill: reading
    title: Reading Notices, Signs, and Classified Ads
    prerequisites: [daily-routine-vocabulary, food-shopping-vocabulary]
    explanation: |
      Public notices, building directories, and classified advertisements require scanning for specific data points.
      Look for opening hours (Öffnungszeiten), prices (Preise), dates, room counts, and contact numbers.
    examples:
      - "Praxis Dr. Schmidt: Sprechzeiten Montag bis Freitag 8:00 - 12:00 Uhr. Mittwochnachmittag geschlossen."
      - "2-Zimmer-Wohnung im Zentrum zu vermieten. 60 qm, 750 Euro warm. Tel: 0171-123456."
      - "Bäckerei Meyer: Wegen Urlaub geschlossen vom 1. bis 15. August."
    exercises:
      - type: multiple_choice
        question: "Schild: 'Dr. Schmidt: Mo-Fr 8-12 Uhr geöffnet.' - Wann kann man die Praxis besuchen?"
        options: ["Am Samstagmorgen", "Am Dienstagnachmittag", "Am Donnerstag um 10 Uhr", "Am Sonntag"]
        correctIndex: 2
      - type: multiple_choice
        question: "Anzeige: 'Fahrrad gebraucht zu verkaufen. Sehr guter Zustand, 85 Euro. Kontakt ab 18 Uhr: 089-98765.' - Was kostet das Fahrrad?"
        options: ["18 Euro", "85 Euro", "98 Euro", "50 Euro"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Schild: 'Samstag und Sonntag ___' (word meaning closed: geschlossen)"
        correctAnswer: "geschlossen"

  - slug: listening-dialogues-numbers-prices
    skill: listening
    title: Listening for Numbers, Dates, and Prices
    prerequisites: [alphabet-greetings-numbers, verb-sein-haben]
    explanation: |
      Transactional conversations require extracting numerical values from spoken German.
      Train your ear to recognize spoken numbers, compound figures, monetary expressions (Euro and Cent), and phone numbers.
    examples:
      - "Das macht dann zusammen vierzehn Euro fünfzig, bitte."
      - "Meine Telefonnummer ist null-eins-sieben-sechs, achtundfünfzig, vierundzwanzig, drei."
      - "Wir treffen uns am Dienstag, dem vierzehnten Mai, um sechzehn Uhr."
    exercises:
      - type: multiple_choice
        question: "Gespräch: 'Wie viel kostet der Pullover?' - 'Er ist reduziert und kostet jetzt 29 Euro.' - Was kostet der Pullover?"
        options: ["19 Euro", "29 Euro", "39 Euro", "92 Euro"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Verkäufer: 'Zwei Brote kosten genau ___ Euro.' (spoken: sechs)"
        correctAnswer: "6"
      - type: multiple_choice
        question: "Frau: 'Wann kommt der Bus?' - Mann: 'Um dreizehn Uhr fünfundvierzig.' - Welche Uhrzeit ist gemeint?"
        options: ["13:15", "13:45", "14:15", "14:45"]
        correctIndex: 1

  - slug: writing-short-invitation
    skill: writing
    title: Writing Simple Messages and Invitations
    prerequisites: [sentence-structure-w-questions, daily-routine-vocabulary]
    explanation: |
      Writing short personal notes or invitations involves standard opening greetings, clear statement of purpose, event details, and an appropriate closing.
      Use 'Liebe/Lieber...' for informal greetings, provide the time and location of the event, and conclude with 'Herzliche Grüße' or 'Viele Grüße'.
    examples:
      - "Liebe Maria, ich lade dich herzlich zu meiner Geburtstagsparty ein. Wir feiern am Samstag um 19 Uhr bei mir. Kannst du kommen? Viele Grüße, Lukas."
      - "Lieber Peter, danke für die Einladung. Ich komme sehr gerne am Sonntag um 15 Uhr. Herzliche Grüße, Anna."
      - "Hallo Alex, hast du morgen Zeit? Wir wollen im Park grillen. Ruf mich bitte an! Dein Jan."
    exercises:
      - type: free_text
        prompt: "Write a two-sentence informal invitation to a friend for coffee tomorrow at 15:00."
        modelAnswer: "Lieber Marco, hast du morgen um 15 Uhr Zeit für einen Kaffee? Ich lade dich herzlich ein!"
      - type: fill_blank
        textWithBlank: "Liebe Julia, danke ___ deine nette Einladung."
        correctAnswer: "für"
      - type: multiple_choice
        question: "Welche Grußformel ist informell und passt für einen Freund?"
        options: [
          "Sehr geehrter Herr Meyer,",
          "Mit freundlichen Grüßen",
          "Lieber Markus,",
          "Sehr geehrte Damen und Herren,"
        ]
        correctIndex: 2

  - slug: speaking-self-introduction
    skill: speaking
    title: Spoken Personal Introduction
    prerequisites: [sentence-structure-w-questions, alphabet-greetings-numbers]
    explanation: |
      A basic spoken introduction covers seven key personal points: name, age, country of origin, place of residence, languages spoken, profession, and hobbies.
      Sentences should be concise, grammatically correct, and use clear pronunciation.
    examples:
      - "Mein Name ist Marco Rossi."
      - "Ich komme aus Italien und wohne in Frankfurt."
      - "Ich bin 28 Jahre alt und arbeite als Ingenieur."
      - "Meine Hobbys sind Schwimmen und Gitarre spielen."
    exercises:
      - type: free_text
        prompt: "Introduce yourself in German stating your name and your home country."
        modelAnswer: "Ich heiße Elena und ich komme aus Spanien."
      - type: free_text
        prompt: "State your place of residence and your profession in one German sentence."
        modelAnswer: "Ich wohne in Berlin und bin Lehrer von Beruf."
      - type: multiple_choice
        question: "Welche Frage beantwortet man mit: 'Ich spreche Englisch und ein bisschen Deutsch'?"
        options: [
          "Wo wohnen Sie?",
          "Was sind Ihre Hobbys?",
          "Welche Sprachen sprechen Sie?",
          "Was machen Sie beruflich?"
        ]
        correctIndex: 2