  - slug: goethe-hoeren-teil3-drei-sprecher-zuordnen
    skill: listening
    title: "Goethe Hören Teil 3: Podiumsgespräch mit drei Sprechern"
    prerequisites: []
    explanation: |
      In Teil 3 hören Sie ein lebendiges Gespräch zwischen drei Personen (z. B. Moderator, ein weiblicher Gast, ein männlicher Gast) zu einem aktuellen gesellschaftlichen Thema.
      Der Text wird nur EINMAL abgespielt!
      Sie haben 7 Thesen/Aussagen vor sich und müssen entscheiden: Wer äußert diese Meinung? (Sprecher 1, Sprecher 2 oder Sprecher 3?).
      Achten Sie auf Stimmfarben, Intonation, namentliche Ansprachen durch den Moderator und Formulierungen der Zustimmung oder Ablehnung.
    examples:
      - "Aussage: 'Hält eine gesetzliche Pflicht für unverhältnismäßig.' -> Im Audio sagt Herr Berg: 'Wir sollten auf die Eigenverantwortung der Bürger vertrauen statt ständig mit Verboten zu drohen.' -> Lösung: Herr Berg."
    exercises:
      - type: multiple_choice
        question: "Moderator: 'Frau Dr. Sommer, teilen Sie diese Ansicht?' - Frau Dr. Sommer: 'Ganz im Gegenteil. Wenn wir jetzt nicht einschreiten, kollabiert das System in spätestens fünf Jahren.' - Wer sieht dringenden gesetzlichen Handlungsbedarf?"
        options:
          - "Der Moderator"
          - "Frau Dr. Sommer"
          - "Der zweite Gast (Herr Meyer)"
        correctIndex: 1
      - type: free_text
        prompt: "Welcher Tipp hilft bei Teil 3, um während des Hörens die Sprecher nicht zu verwechseln?"
        modelAnswer: "Sich zu Beginn der Sendung die Namen der Gäste und ihre Stimmmerkmale (männlich/weiblich, jung/alt, Rolle) sofort auf dem Aufgabenblatt kurz zu notieren."

