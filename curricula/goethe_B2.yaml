          - "Die Autobahn wurde komplett gesperrt."
          - "Die Streufahrzeuge sind bereits unterwegs."
          - "Geschwindigkeitsbegrenzungen wurden aufgehoben."
        correctIndex: 1

  - slug: goethe-hoeren-teil2-experteninterview
    skill: listening
    title: "Goethe Hören Teil 2: Experten- und Kulturinterviews"
    prerequisites: []
    explanation: |
      In Teil 2 hören Sie ein ausführliches Radiointerview mit einer Persönlichkeit aus Wissenschaft, Kultur oder Gesellschaft.
      Der Text wird ZWEIMAL abgespielt. Sie bearbeiten 6 Multiple-Choice-Aufgaben (a, b, c).
      Beantworten Sie beim ersten Hören die klaren Aufgaben und markieren Sie Unsicherheiten.
      Nutzen Sie das zweite Hören gezielt zur Verifikation und zur Lösung verbleibender Fragen.
    examples:
      - "Frage: Welches Hauptziel verfolgt das neue Forschungsprojekt? -> a: Die Entwicklung günstigerer Akkus. b: Die Erforschung neuer Werkstoffe. c: Die Senkung der Produktionskosten."
    exercises:
      - type: multiple_choice
        question: "Interviewauszug: 'Unsere ursprüngliche Hypothese war, dass Jugendliche primär durch Unterhaltungsvideos lernen. Überraschenderweise zeigte sich jedoch, dass kurze Erklärformate zu naturwissenschaftlichen Themen die höchsten Abrufzahlen erzielen.' - Was war das überraschende Ergebnis?"
        options:
          - "Jugendliche meiden naturwissenschaftliche Themen im Netz."
          - "Wissenschaftliche Erklärvideos werden häufiger aufgerufen als erwartet."
          - "Unterhaltungsvideos sind das beliebteste Bildungsmedium."
