  - slug: goethe-sprechen-teil1-vortrag
    skill: speaking
    title: "Goethe Sprechen Teil 1: Strukturierter Vortrag mit Optionenvergleich"
    prerequisites: [goethe-meinungsausdruck-argumentationsstrukturen]
    explanation: |
      In Teil 1 der mündlichen Prüfung (ca. 4 Minuten pro Kandidat) halten Sie einen Vortrag zu einem gewählten Thema aus zwei Vorschlägen (z. B. Formen der Kinderbetreuung, Arbeitszeitmodelle, Urlaubsmöglichkeiten).
      Ihre Präsentation muss folgende Pflichtbestandteile enthalten:
      1. Einleitung: Thema vorstellen und Gliederung nennen.
      2. Mehrere Möglichkeiten/Alternativen beschreiben (z. B. Kita vs. Tagesmutter).
      3. Vor- und Nachteile dieser Alternativen abwägen.
      4. Eine Möglichkeit genauer schildern und Ihre persönliche Meinung/Erfahrung begründen.
      5. Abschluss und Übergabe an das Publikum für Nachfragen.
    examples:
      - "Guten Tag, das Thema meiner heutigen Präsentation lautet 'Erneuerbare Energien im Alltag'..."
      - "Zunächst möchte ich zwei Optionen vorstellen: die Installation einer Photovoltaikanlage auf dem Eigenheim und die Beteiligung an einem Bürgerwindpark."
      - "Aus meiner Sicht überwiegen die Vorteile einer eigenen Solaranlage, da man dadurch energieautark wird..."
    exercises:
      - type: free_text
        prompt: "Formulieren Sie den Übergang vom Vergleich der Möglichkeiten zur Darlegung Ihrer eigenen Meinung in Ihrem Goethe-Vortrag."
        modelAnswer: "Nachdem ich die verschiedenen Optionen gegenübergestellt habe, möchte ich nun auf meine persönliche Einschätzung eingehen. Meines Erachtens ist die flexibelste Lösung..."
      - type: multiple_choice
        question: "Welcher Punkt ist in Goethe Sprechen Teil 1 zwingend gefordert?"
        options:
          - "Ein langes Gedicht rezitieren."
          - "Mindestens zwei Alternativen vergleichen und eine genauer beschreiben."
          - "Den Partner während seines Vortrags unterbrechen."
          - "Ausschließlich aus dem Gedächtnis historische Daten aufzählen."
        correctIndex: 1

  - slug: goethe-sprechen-teil2-diskussion
    skill: speaking
    title: "Goethe Sprechen Teil 2: Kontroverse Diskussion mit dem Partner"
    prerequisites: [goethe-meinungsausdruck-argumentationsstrukturen]
    explanation: |
      In Teil 2 diskutieren Sie ca. 5 Minuten lang mit Ihrem Prüfungspartner über ein vorgegebenes streitbares Thema (z. B. 'Sollte die Innenstadt komplett autofrei werden?').
      Erwartet wird eine dynamische, interaktive Debatte:
      - Bringen Sie stichhaltige Argumente vor.
      - Gehen Sie direkt auf die Aussagen Ihres Partners ein ("Da bin ich ganz Ihrer Meinung, allerdings...", "Diesem Punkt möchte ich widersprechen...").
      - Bleiben Sie sachlich, vertreten Sie Ihren Standpunkt konsequent, aber zeigen Sie sich am Ende kompromissbereit, um ein gemeinsames Fazit zu ziehen.
    examples:
      - "Ich halte ein generelles Tempolimit auf Autobahnen für sinnvoll, da es nachweislich schwere Unfälle verhindert und den Schadstoffausstoß senkt."
      - "Verstehen Sie mich nicht falsch, Sicherheit ist essenziell, aber moderne Assistenzsysteme regeln dies bereits. Wäre eine flexible Beschilderung nicht zielführender?"
      - "Könnten wir uns darauf einigen, dass ein Tempolimit zumindest auf unfallträchtigen Streckenabschnitten Pflicht sein sollte?"
    exercises:
      - type: free_text
        prompt: "Formulieren Sie einen diplomatischen Kompromissvorschlag in einer Diskussion über das Verbot von Plastikverpackungen im Supermarkt."
        modelAnswer: "Vielleicht könnten wir uns darauf verständigen, dass Einwegplastik bei Obst und Gemüse verboten wird, während für empfindliche Fleisch- und Molkereiprodukte eine Übergangsfrist gilt."
      - type: multiple_choice
        question: "Was führt bei Goethe Sprechen Teil 2 zu Punktabzug?"
        options:
          - "Den Partner ausreden lassen und anschließend argumentieren."
          - "Das Gespräch völlig dominieren, ohne den Partner zu Wort kommen zu lassen."
          - "Rhetorische Rückfragen an den Partner stellen."
          - "Einen Kompromiss aushandeln."
        correctIndex: 1