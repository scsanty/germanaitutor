  - slug: goethe-schreiben-teil1-forumsbeitrag
    skill: writing
    title: "Goethe Schreiben Teil 1: Verfassen eines Forumsbeitrags"
    prerequisites: [goethe-meinungsausdruck-argumentationsstrukturen]
    explanation: |
      In Teil 1 des Moduls Schreiben verfassen Sie einen Forumsbeitrag (ca. 150 Wörter) zu einem kontroversen Thema (z. B. Tempolimit, plastikfreie Kantine, Mediennutzung im Kindergarten).
      Sie müssen vier Inhaltspunkte zwingend und ausgewogen bearbeiten:
      1. Äußern Sie Ihre eigene Meinung zum Thema und begründen Sie diese.
      2. Nennen Sie Gründe, warum das Thema aktuell diskutiert wird.
      3. Schlagen Sie alternative Möglichkeiten vor.
      4. Erläutern Sie die Vor- und Nachteile dieser Alternativen.
      Achten Sie auf einen flüssigen Diskussionsstil (Anrede der Community: "Liebe Forumsmitglieder, ..."), Absätze und eine logische Gedankenführung.
    examples:
      - "Liebe Forenmitglieder, ich verfolge die Debatte über fleischlose Ernährung mit großem Interesse..."
      - "Meines Erachtens ist es nicht zielführend, Fleischkonsum gänzlich zu verbieten; vielmehr sollten wir..."
      - "Eine sinnvolle Alternative bestünde darin, vegetarische Gerichte ansprechend und preisgünstig anzubieten."
    exercises:
      - type: free_text
        prompt: "Formulieren Sie den Hauptteil (ca. 50 Wörter) eines Forumsbeitrags zum Thema 'E-Scooter in Innenstädten': Eigene Meinung und Gründe für deren Beliebtheit."
        modelAnswer: "Meines Erachtens stellen E-Scooter eine praktische Ergänzung des Nahverkehrs dar. Sie werden immer beliebter, weil man mit ihnen schnell und flexibel kurze Strecken zurücklegen kann, ohne im Stau zu stehen. Allerdings birgt das unachtsame Abstellen auf Gehwegen erhebliche Gefahren für Fußgänger."
      - type: multiple_choice
        question: "Wie viele Wörter sollte der Forumsbeitrag in Goethe Schreiben Teil 1 idealerweise umfassen?"
        options:
          - "Ca. 80 Wörter"
          - "Ca. 150 Wörter"
          - "Mindestens 300 Wörter"
          - "Genau 50 Wörter"
        correctIndex: 1

  - slug: goethe-schreiben-teil2-formelle-mitteilung
    skill: writing
    title: "Goethe Schreiben Teil 2: Formelle berufliche Mitteilung"
    prerequisites: [goethe-feste-nomen-verb-gefuege]
    explanation: |
      In Teil 2 schreiben Sie eine formelle berufliche Nachricht (ca. 100 Wörter) an Vorgesetzte, Geschäftspartner oder Dozenten.
      Typische Situationen: Entschuldigung für Nichterscheinen, Bitte um Fristverlängerung, Beschwerde über defekte Arbeitsmittel, Bitte um Unterstützung bei einem Projekt.
      Es müssen alle vorgegebenen Leitpunkte (meist 4 Punkte) registergerecht abgehandelt werden.
      Verwenden Sie das formelle Register ("Sehr geehrte/r Frau/Herr...", "Mit freundlichen Grüßen") und höfliche Konjunktiv-II-Konstruktionen.
    examples:
      - "Sehr geehrte Frau Dr. Wagner, hiermit muss ich mich leider für das gestrige Projekttreffen entschuldigen..."
      - "Aufgrund einer akuten Magen-Darm-Grippe war es mir unmöglich, rechtzeitig Bescheid zu geben."
      - "Ich werde die versäumten Aufgaben schnellstmöglich nachholen und bis Freitag einreichen."
    exercises:
      - type: free_text
        prompt: "Verfassen Sie eine formelle Bitte um Verschiebung eines Abgabetermins an Ihren Dozenten (ca. 40 Wörter)."
        modelAnswer: "Sehr geehrter Herr Professor Müller, aufgrund eines unvorhersehbaren Krankheitsfalls in meiner Familie möchte ich mich erkundigen, ob es möglich wäre, die Abgabefrist für meine Hausarbeit um eine Woche zu verlängern. Für Ihr Verständnis wäre ich Ihnen sehr dankbar."
      - type: fill_blank
        textWithBlank: "Formelle Anrede für einen Dozenten mit Doktortitel: 'Sehr geehrter Herr ___ Klein,'"
