track: telc
level: A2

lessons:
  - slug: telc-perfekt-daily-work
    skill: grammar
    title: "Perfekt Tense for Daily Work and Life Tasks"
    prerequisites: []
    explanation: |
      In telc A2 examinations, describing workplace duties, completed administrative tasks, and daily routines requires active control of the Perfekt.
      Form the Perfekt with the conjugated present of haben or sein and the past participle at the end of the sentence.
      Workplace verbs like anrufen (hat angerufen), ausfüllen (hat ausgefüllt), bearbeiten (hat bearbeitet), and überweisen (hat überwiesen) are essential.
    examples:
      - "Ich habe die Unterlagen bereits an die Behörde geschickt."
      - "Der Sachbearbeiter hat den Antrag gestern geprüft."
      - "Haben Sie die Rechnung schon bezahlt?"
      - "Mein Kollege ist heute früher nach Hause gegangen."
    exercises:
      - type: fill_blank
        textWithBlank: "Haben Sie das Formular vollständig ___ ? (ausfüllen)"
        correctAnswer: "ausgefüllt"
      - type: multiple_choice
        question: "Welches Hilfsverb gehört zu 'überweisen'? 'Ich ___ das Geld gestern überwiesen.'"
        options: ["habe", "bin", "werde", "hätte"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Die Handwerker ___ um 8 Uhr gekommen. (sein)"
        correctAnswer: "sind"
      - type: flashcard
        front: "einen Antrag ausfüllen -> hat ausgefüllt"
        back: "to fill out an application -> filled out"

  - slug: telc-dative-prepositions-errands
    skill: grammar
    title: "Dative Prepositions for Appointments and Errands"
    prerequisites: []
    explanation: |
      Organizing errands and official appointments requires the prepositions mit, nach, von, zu, bei, and aus, which always govern the dative case.
      Remember the common contractions: zu + dem = zum, zu + der = zur, bei + dem = beim, von + dem = vom.
      Notice the noun changes: masculine/neuter takes dem (einem), feminine takes der (einer), and plural takes den + -n.
    examples:
      - "Ich muss morgen früh zum Arzt und danach zur Bank gehen."
      - "Herr Müller arbeitet seit drei Jahren bei einer großen Firma."
      - "Ich komme gerade vom Einwohnermeldeamt."
      - "Kommen Sie mit dem Bus oder mit dem Auto zum Vorstellungsgespräch?"
    exercises:
      - type: multiple_choice
        question: "Welche Form ist korrekt? 'Ich gehe heute ___ Arzt (der Arzt).'"
        options: ["zum", "zur", "nach", "bei"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Sie spricht gerade mit ___ Chefin. (die Chefin / Dativ)"
        correctAnswer: "der"
      - type: fill_blank
        textWithBlank: "Wir treffen uns beim Eingang von ___ Bahnhof. (der Bahnhof / Dativ: dem)"
        correctAnswer: "dem"
      - type: flashcard
        front: "zu der Bank / bei dem Arzt"
        back: "zur Bank / beim Arzt"

  - slug: telc-subordinating-conjunctions-weil-denn
    skill: grammar
    title: "Giving Reasons: Weil vs. Denn in Administrative Inquiries"
    prerequisites: []
    explanation: |
      Explaining absence, delays, or rescheduling requests requires causal connectors.
      'Weil' is a subordinating conjunction: it moves the finite verb to the end of the clause.
      'Denn' is a coordinating conjunction: it occupies position 0, leaving standard subject-verb order unchanged.
    examples:
      - "Ich kann morgen nicht kommen, weil ich einen wichtigen Arzttermin habe."
      - "Ich kann morgen nicht kommen, denn ich habe einen wichtigen Arzttermin."
      - "Er bittet um Verlängerung, weil die Dokumente noch fehlen."
      - "Frau Keller bleibt zu Hause, denn ihr Kind ist krank."
    exercises:
      - type: multiple_choice
        question: "Welcher Satz mit 'weil' ist grammatisch korrekt?"
        options: [
          "Ich komme später, weil mein Bus hatte Verspätung.",
          "Ich komme später, weil mein Bus Verspätung hatte.",
          "Ich komme später, weil hatte mein Bus Verspätung.",
          "Ich komme später, denn mein Bus Verspätung hatte."
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Er sagt den Termin ab, ___ er beruflich verreisen muss. (subordinating)"
        correctAnswer: "weil"
      - type: fill_blank
        textWithBlank: "Wir bitten um Entschuldigung, ___ der Zug hat leider Verspätung. (coordinating: position 0)"
        correctAnswer: "denn"
      - type: free_text
        prompt: "Write a sentence explaining why you are late using 'weil'."
        modelAnswer: "Ich komme zu spät, weil die S-Bahn Verspätung hatte."

  - slug: telc-modal-verbs-praeteritum
    skill: grammar
    title: "Präteritum of Modal Verbs in Excuses and Explanations"
    prerequisites: []
    explanation: |
      In telc written tasks (such as notes to employers, teachers, or landlords), past obligations and incapacities are expressed using the Präteritum of modal verbs.
      Use musste (had to), konnte (was able to), durfte (was permitted to), and sollte (was supposed to).
      Singular 1st and 3rd persons share the same form without umlaut (ich konnte, er musste).
    examples:
      - "Gestern konnte ich nicht zur Arbeit kommen, weil ich hohes Fieber hatte."
      - "Mein Sohn musste gestern zu Hause bleiben."
      - "Wir durften den Raum während des Tests nicht verlassen."
      - "Ich sollte mich bei der Personalabteilung melden."
    exercises:
      - type: fill_blank
        textWithBlank: "Herr Becker ___ gestern Überstunden machen. (müssen / Präteritum)"
        correctAnswer: "musste"
      - type: multiple_choice
        question: "Welches Modalverb drückt vergangene Unfähigkeit aus? 'Ich ___ Sie gestern nicht telefonisch erreichen.'"
        options: ["konnte", "musste", "sollte", "durfte"]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Wir ___ den Termin leider nicht wahrnehmen. (können)"
        correctAnswer: "konnten"
      - type: flashcard
        front: "ich musste / ich konnte"
        back: "I had to / I could (was able to)"

  - slug: telc-adjective-endings-accusative-dative
    skill: grammar
    title: "Adjective Endings in Practical Transactions"
    prerequisites: [telc-dative-prepositions-errands]
    explanation: |
      Handling commercial and residential transactions requires declining adjectives after indefinite articles (ein, eine) and negative articles (kein, keine).
      In the accusative: masculine takes -en (einen neuen Mietvertrag); neuter takes -es (ein helles Zimmer); feminine takes -e (eine neue Wohnung).
      In the dative: all genders without exception take -en after ein/kein/possessives (in einem großen Büro, mit einer freundlichen Nachbarin).
    examples:
      - "Ich suche eine bezahlbare Wohnung mit einem sonnigen Balkon."
      - "Wir haben einen gebrauchten Schreibtisch gekauft."
      - "Er wohnt in einem modernen Mehrfamilienhaus."
      - "Haben Sie ein freies Einzelzimmer?"
    exercises:
      - type: fill_blank
        textWithBlank: "Der Mieter wünscht sich einen ruhig___ Nachbarn. (masculine accusative)"
        correctAnswer: "en"
      - type: multiple_choice
        question: "Welche Endung ist im Dativ korrekt? 'Ich wohne in einem groß___ Haus.'"
        options: ["-es", "-em", "-en", "-er"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Sie sucht ein ruhig___ Zimmer im Stadtzentrum. (neuter accusative)"
        correctAnswer: "es"
      - type: flashcard
        front: "mit einem freundlichen Gruß (Dativ)"
        back: "with a friendly greeting"

  - slug: telc-reflexive-verbs-work-social
    skill: grammar
    title: "Reflexive Verbs for Social and Professional Contexts"
    prerequisites: []
    explanation: |
      Many communicative verbs in practical German require reflexive pronouns (mich, dich, sich, uns, euch, sich).
      Crucial verbs for vocational and official contexts include: sich bewerben um (to apply for), sich verspäten (to be delayed), sich interessieren für (to be interested in), and sich anmelden (to register).
    examples:
      - "Ich bewerbe mich um die Stelle als Verkäufer."
      - "Entschuldigen Sie bitte, die Bahn hat Verspätung und ich verspäte mich."
      - "Interessieren Sie sich für diese Wohnung?"
      - "Man muss sich rechtzeitig beim Bürgeramt anmelden."
    exercises:
      - type: multiple_choice
        question: "Welches Pronomen passt? 'Frau Demir bewirbt ___ um die freie Stelle.'"
        options: ["ihr", "sie", "sich", "ihn"]
        correctIndex: 2
      - type: fill_blank
        textWithBlank: "Ich möchte ___ gerne für den Deutschkurs anmelden."
        correctAnswer: "mich"
      - type: fill_blank
        textWithBlank: "Bitte entschuldigen Sie, wir verspäten ___ um zehn Minuten."
        correctAnswer: "uns"
      - type: flashcard
        front: "sich bewerben um (+ Akk.)"
        back: "to apply for (a job/position)"

  - slug: telc-conditional-wenn-clauses
    skill: grammar
    title: "Conditional Clauses with Wenn in Rules and Agreements"
    prerequisites: [telc-subordinating-conjunctions-weil-denn]
    explanation: |
      Conditional structures using wenn (if / when) explain conditions, rules, and arrangements in community and work life.
      When a sentence begins with the 'wenn' clause, the finite verb in that clause goes to the end; the main clause follows immediately with the conjugated verb in first position.
      Formula: 'Wenn [..., Verb], [Verb ...]'.
    examples:
      - "Wenn Sie Fragen haben, rufen Sie mich bitte an."
      - "Wenn das Büro geschlossen ist, werfen Sie den Schlüssel in den Briefkasten."
      - "Ich kann den Vertrag unterschreiben, wenn alle Angaben stimmen."
      - "Wenn Sie krank sind, müssen Sie eine Arbeitsunfähigkeitsbescheinigung vorlegen."
    exercises:
      - type: multiple_choice
        question: "Welche Wortstellung ist korrekt nach einem 'Wenn'-Satz?"
        options: [
          "Wenn Sie Hilfe brauchen, Sie können mich anrufen.",
          "Wenn Sie Hilfe brauchen, können Sie mich anrufen.",
          "Wenn Sie Hilfe brauchen, anrufen können Sie mich.",
          "Wenn Sie Hilfe brauchen, Sie anrufen mich."
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wenn Sie verhindert ___ , geben Sie uns bitte 24 Stunden vorher Bescheid. (sein)"
        correctAnswer: "sind"
      - type: free_text
        prompt: "Complete the conditional sentence: 'Wenn ich Zeit habe, ... (I will help you)'."
        modelAnswer: "Wenn ich Zeit habe, helfe ich dir."

  - slug: telc-vocab-workplace-professions
    skill: vocabulary
    title: "Workplace, Professional Duties, and Schedules"
    prerequisites: []
    explanation: |
      Navigating work environments requires vocabulary related to contracts, responsibilities, shifts, and leaves of absence.
      Key terms include: der Arbeitgeber (employer), der Arbeitnehmer (employee), die Überstunden (overtime), die Teilzeit / Vollzeit (part-time / full-time), der Schichtdienst (shift work), and die Kündigung (termination/resignation).
      Important practical expressions include Urlaub beantragen (to request vacation) and krankmelden (to call in sick).
    examples:
      - "Herr Al-Mansur arbeitet im Schichtdienst, auch an Wochenenden."
      - "Ich muss heute zwei Überstunden machen, weil viele Bestellungen da sind."
      - "Sie hat ihren Urlaub für den Sommer bereits beim Chef beantragt."
      - "Mitarbeiter müssen sich bis 8:00 Uhr telefonisch krankmelden."
    exercises:
      - type: flashcard
        front: "sich krankmelden"
        back: "to call in sick"
      - type: multiple_choice
        question: "Was bedeutet 'Überstunden machen'?"
        options: [
          "Mehr Stunden arbeiten als im Vertrag vereinbart",
          "Zu spät zur Arbeit kommen",
          "Eine Pause einlegen",
          "Den Arbeitsplatz wechseln"
        ]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Er arbeitet nicht 40 Stunden, sondern 20 Stunden pro Woche, also in ___ ."
        correctAnswer: "Teilzeit"
      - type: free_text
        prompt: "State that you want to apply for vacation next week."
        modelAnswer: "Ich möchte für nächste Woche Urlaub beantragen."

  - slug: telc-vocab-banking-official-errands
    skill: vocabulary
    title: "Banking, Municipal Offices, and Mail Services"
    prerequisites: []
    explanation: |
      Navigating civic infrastructure requires understanding terminology for financial, postal, and governmental services.
      Banking terms include: das Konto (account), die Überweisung (bank transfer), der Dauerauftrag (standing order), and das Bargeld (cash).
      Postal and administrative terms include: der Personalausweis (ID card), die Meldebescheinigung (residence registration certificate), das Einschreiben (registered mail), and der Schalter (service counter).
    examples:
      - "Ich möchte ein Girokonto bei der Sparkasse eröffnen."
      - "Bitte legen Sie zur Anmeldung Ihren Personalausweis vor."
      - "Ich habe die Miete per Überweisung bezahlt."
      - "Diesen Brief schicke ich per Einschreiben mit Rückschein."
    exercises:
      - type: flashcard
        front: "die Überweisung"
        back: "the bank transfer"
      - type: multiple_choice
        question: "Welches Dokument beweist den Wohnsitz nach der Anmeldung beim Bürgeramt?"
        options: [
          "Die Meldebescheinigung",
          "Die Quittung",
          "Die Fahrkarte",
          "Das Zeugnis"
        ]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Bitte überweisen Sie den Betrag auf unser ___ bei der Postbank. (account: das Konto)"
        correctAnswer: "Konto"
      - type: free_text
        prompt: "Say that you would like to open a checking account."
        modelAnswer: "Ich möchte gerne ein Girokonto eröffnen."

  - slug: telc-vocab-mobility-trains-buses
    skill: vocabulary
    title: "Public Mobility, Disruption Notices, and Tickets"
    prerequisites: []
    explanation: |
      Commuting requires understanding announcements and signs related to routes, delays, and fares.
      Key terms include: die Verbindung (connection), die Monatskarte (monthly pass), die Störung (fault/disruption), der Schienenersatzverkehr (rail replacement bus service), and das Gleis (railway platform/track).
    examples:
      - "Wegen einer Stellwerkstörung gibt es Verspätungen auf der S-Bahn-Linie 1."
      - "Zwischen Hauptbahnhof und Messe fährt ein Schienenersatzverkehr mit Bussen."
      - "Die Monatskarte für das gesamte Tarifgebiet kostet 78 Euro."
      - "Wo kann ich mein Ticket entwerten?"
    exercises:
      - type: flashcard
        front: "der Schienenersatzverkehr (SEV)"
        back: "rail replacement bus service"
      - type: multiple_choice
        question: "Was bedeutet das Wort 'entwerten' bei einer Fahrkarte?"
        options: [
          "Das Ticket stempeln/ungültig machen vor der Fahrt",
          "Das Ticket wegwerfen",
          "Ein neues Ticket kaufen",
          "Die Fahrkarte dem Kontrolleur zeigen"
        ]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Aufgrund einer technischen ___ kommt es heute zu Zugausfällen. (disruption: die Störung)"
        correctAnswer: "Störung"
      - type: free_text
        prompt: "Ask whether this ticket is valid for zone A."
        modelAnswer: "Ist dieses Ticket für den Tarifbereich A gültig?"

  - slug: telc-vocab-scheduling-calendar-appointments
    skill: vocabulary
    title: "Coordinating Appointments and Calendar Commitments"
    prerequisites: []
    explanation: |
      Scheduling commitments requires phrases to propose, accept, reschedule, or cancel dates.
      Key verbs include: vereinbaren (to arrange/agree on), verschieben (to postpone/shift), absagen (to cancel), and bestätigen (to confirm).
      Common idioms include: 'Passt es Ihnen am...?' (Does... suit you?), 'Da habe ich leider keine Zeit' (Unfortunately I have no time then), and 'Einen Termin wahrnehmen' (to attend an appointment).
    examples:
      - "Können wir den Termin vom Dienstag auf Donnerstag verschieben?"
      - "Ich muss unseren Termin leider absagen, da ich beruflich verhindert bin."
      - "Passt es Ihnen am kommenden Freitag um 14:00 Uhr?"
      - "Ich möchte diesen Termin gerne verbindlich bestätigen."
    exercises:
      - type: flashcard
        front: "einen Termin verschieben"
        back: "to postpone / reschedule an appointment"
      - type: multiple_choice
        question: "Was sagt man, wenn man zu einem vorgeschlagenen Zeitpunkt nicht kann?"
        options: [
          "Da habe ich leider schon etwas vor.",
          "Das passt mir ausgezeichnet.",
          "Ja, das machen wir so.",
          "Ich komme sehr gern."
        ]
        correctIndex: 0
      - type: fill_blank
        textWithBlank: "Können wir einen neuen Termin ___ ? (to arrange/agree: vereinbaren)"
        correctAnswer: "vereinbaren"
      - type: free_text
        prompt: "Ask someone if Monday at 10:00 AM suits them."
        modelAnswer: "Passt es Ihnen am Montag um 10 Uhr?"

  - slug: telc-reading-teil1-directory-matching
    skill: reading
    title: "telc Lesen Teil 1: Navigating Directories and Information Boards"
    prerequisites: [telc-vocab-banking-official-errands]
    explanation: |
      In telc Deutsch A2 Lesen Teil 1, candidates match five everyday needs to specific floors, counters, or departments on an informational board or directory (e.g., at a trade fair, shopping center, or municipal building).
      Scan for precise category keywords and synonyms rather than reading every entry in detail.
    examples:
      - "Aufgabe: Sie suchen ein Wörterbuch für Ihren Sprachkurs. -> Infotafel: 1. Stock: Belletristik, Fachbücher, Lehr- und Wörterbücher. -> Lösung: 1. Stock."
      - "Aufgabe: Sie möchten einen Pass beantragen. -> Rathaus-Wegweiser: Erdgeschoss: Bürgerbüro, Pass- und Ausweisstelle. -> Lösung: Erdgeschoss."
    exercises:
      - type: multiple_choice
        question: "Situation: Sie haben Zahnschmerzen und suchen eine Praxis im Ärztehaus. Infotafel: EG: Apotheke, Sanitätshaus; 1. OG: Allgemeinmedizin, Kinderarzt; 2. OG: Zahnarztpraxis Dr. Weiss, Kieferorthopädie. Wohin gehen Sie?"
        options: ["Ins Erdgeschoss", "In den 1. Stock", "In den 2. Stock"]
        correctIndex: 2
      - type: multiple_choice
        question: "Situation: Sie möchten ein Buch ausleihen. Verzeichnis: Raum 101: Verwaltung; Raum 105: Lesesaal & Buchausleihe; Raum 110: Cafeteria. Wohin gehen Sie?"
        options: ["Raum 101", "Raum 105", "Raum 110"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Wegweiser: 'Fundbüro und Beschwerdestelle befinden sich im ___ .' (word for ground floor: Erdgeschoss)"
        correctAnswer: "Erdgeschoss"

  - slug: telc-reading-teil2-informational-article
    skill: reading
    title: "telc Lesen Teil 2: Factual Texts and True/False Verification"
    prerequisites: [telc-perfekt-daily-work, telc-subordinating-conjunctions-weil-denn]
    explanation: |
      In telc Lesen Teil 2, candidates read an authentic journalistic or informational article (e.g., about volunteer work, community programs, or vocational training) and evaluate five statements as Richtig (True) or Falsch (False).
      Read each statement carefully before scanning the text, watching out for qualifying words like immer, nie, nur, or alle.
    examples:
      - "Text: 'Der Sportverein bietet ab November spezielle Schwimmkurse ausschließlich für Senioren an.' - Aussage: Junge Erwachsene können an den neuen Schwimmkursen teilnehmen. -> Falsch."
      - "Text: 'Die Kurse finden samstags statt und kosten für Vereinsmitglieder keinen Aufpreis.' - Aussage: Für Mitglieder des Vereins ist der Kurs kostenlos. -> Richtig."
    exercises:
      - type: multiple_choice
        question: "Text: 'Das neue Nachbarschaftszentrum öffnet täglich von 9 bis 18 Uhr. Dienstags bleibt es wegen interner Teamsitzungen für Besucher geschlossen.' - Aussage: Am Dienstagnachmittag kann man das Zentrum besuchen."
        options: ["Richtig", "Falsch"]
        correctIndex: 1
      - type: multiple_choice
        question: "Text: 'Für die Teilnahme am Kochkurs müssen die Zutaten nicht mitgebracht werden. Alles ist in der Gebühr enthalten.' - Aussage: Die Teilnehmer müssen das Essen selbst zum Kurs mitbringen."
        options: ["Richtig", "Falsch"]
        correctIndex: 1
      - type: multiple_choice
        question: "Text: 'Bürger können ihren Sperrmüll zweimal pro Jahr ohne zusätzliche Gebühren abholen lassen.' - Aussage: Die Abholung von Sperrmüll ist bis zu zweimal jährlich kostenfrei."
        options: ["Richtig", "Falsch"]
        correctIndex: 0

  - slug: telc-reading-teil3-classifieds-matching
    skill: reading
    title: "telc Lesen Teil 3: Matching Classified Advertisements"
    prerequisites: [telc-vocab-workplace-professions, telc-vocab-scheduling-calendar-appointments]
    explanation: |
      In telc Lesen Teil 3, candidates match five individuals with specific requirements to seven classified advertisements (a through g).
      Carefully note restrictive conditions (e.g., weekend availability, price limits, specific neighborhoods, or required skills) to avoid choosing distracting near-matches.
    examples:
      - "Person: Anna sucht einen Nebenjob am Wochenende als Babysitterin in Köln-Ehrenfeld. Anzeige c: 'Suche zuverlässige Kinderbetreuung für samstags in Ehrenfeld.' -> Passt zu Anna."
      - "Person: Familie Meyer sucht ein Ferienhaus an der Ostsee, in dem Hunde erlaubt sind. Anzeige f: 'Gemütliches Ferienhaus am Strand, Haustiere herzlich willkommen!' -> Passt zu Familie Meyer."
    exercises:
      - type: multiple_choice
        question: "Person: Herr Klein sucht einen gebrauchten Kleinwagen bis maximal 3.000 Euro. Welche Anzeige passt? Anzeige a: 'VW Golf, Baujahr 2018, Top-Zustand, 9.500 Euro.' Anzeige b: 'Opel Corsa, fahrbereit, TÜV neu, VB 2.400 Euro.'"
        options: ["Anzeige a", "Anzeige b"]
        correctIndex: 1
      - type: multiple_choice
        question: "Person: Sarah möchte abends Spanisch lernen. Anzeige c: 'Sprachstudio: Spanisch für Anfänger jeden Dienstag von 18:30 bis 20:00 Uhr.' Anzeige d: 'Intensivkurs Spanisch: Montag bis Freitag von 8:00 bis 12:00 Uhr.'"
        options: ["Anzeige c", "Anzeige d"]
        correctIndex: 0
      - type: multiple_choice
        question: "Person: Familie sucht eine 4-Zimmer-Wohnung mit Garten. Anzeige e: '3-Zimmer-Wohnung im Dachgeschoss mit Balkon.' Anzeige f: 'Geräumige 4-Zimmer-Erdgeschosswohnung mit eigenem Gartenzugang.'"
        options: ["Anzeige e", "Anzeige f"]
        correctIndex: 1

  - slug: telc-listening-teil1-voicemail-notes
    skill: listening
    title: "telc Hören Teil 1: Note-Taking from Voicemail Messages"
    prerequisites: [telc-vocab-scheduling-calendar-appointments]
    explanation: |
      In telc Hören Teil 1, candidates listen to five recorded telephone answering machine messages (played twice) and fill in missing operational data on memo pads (Notizzettel).
      Listen selectively for names, telephone numbers, meeting locations, times, and specific instructions.
    examples:
      - "Nachricht: 'Hallo Herr Schmidt, hier Praxis Dr. Kranz. Wir müssen Ihren Termin am Donnerstag von 10:00 Uhr auf 14:30 Uhr verschieben. Bitte rufen Sie kurz zurück.' -> Neuer Termin: 14:30 Uhr."
      - "Nachricht: 'Hier Autohaus Wagner. Ihr Wagen ist fertig. Sie können ihn bis 18 Uhr abholen. Die Rechnung beträgt 240 Euro.' -> Rechnungsbetrag: 240 Euro."
    exercises:
      - type: fill_blank
        textWithBlank: "Nachricht: 'Hier Schreinerei Holz. Die Lieferung kommt am Freitag um ___ Uhr.' (spoken: elf)"
        correctAnswer: "11"
      - type: multiple_choice
        question: "Nachricht: 'Guten Tag, hier Kundendienst Becker. Unser Techniker kommt morgen zwischen 8 und 12 Uhr. Bitte stellen Sie sicher, dass jemand zu Hause ist.' - Was soll der Kunde tun?"
        options: [
          "In die Werkstatt kommen",
          "Morgen Vormittag zu Hause sein",
          "Eine neue Rechnung bezahlen"
        ]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Nachricht: 'Bitte rufen Sie mich unter der Nummer 0172-___ zurück.' (spoken: acht-fünf-zwei)"
        correctAnswer: "852"

  - slug: telc-listening-teil2-radio-announcements
    skill: listening
    title: "telc Hören Teil 2: Radio Announcements and Public Reports"
    prerequisites: [telc-vocab-mobility-trains-buses]
    explanation: |
      In telc Hören Teil 2, candidates listen to five short radio announcements (played once) and answer a three-option multiple-choice question for each.
      Announcements cover traffic advisories, event schedules, retail promotions, and weather warnings.
    examples:
      - "Hörtext: 'Der Wetterbericht: Am Nachmittag im Bergland schwere Gewitter mit Hagel. Bitte sichern Sie lose Gegenstände.' - Frage: Wo gibt es Unwetter? -> Im Bergland."
      - "Hörtext: 'Konzerttipp: Das Open-Air-Konzert im Stadtpark beginnt heute wegen Regens erst um 20:30 Uhr.' - Frage: Wann fängt das Konzert an? -> Um 20:30 Uhr."
    exercises:
      - type: multiple_choice
        question: "Radio (1x): 'Verkehrsmeldung für die A5: Wegen einer Wanderbaustelle zwischen Karlsruhe und Rastatt stockt der Verkehr auf vier Kilometern.' - Was ist auf der A5?"
        options: ["Ein Unfall", "Vier Kilometer stockender Verkehr wegen Baustelle", "Eine Vollsperrung"]
        correctIndex: 1
      - type: multiple_choice
        question: "Radio (1x): 'Verbrauchertipp: Frisches Obst und Gemüse auf dem Wochenmarkt am Rathausplatz heute bis 14 Uhr mit Sonderrabatten.' - Wo gibt es die Rabatte?"
        options: ["Im Supermarkt", "Auf dem Wochenmarkt", "Im Einkaufszentrum"]
        correctIndex: 1
      - type: fill_blank
        textWithBlank: "Radio: 'Das Bürgertelefon der Stadt ist heute bis ___ Uhr erreichbar.' (spoken: neunzehn)"
        correctAnswer: "19"

  - slug: telc-listening-teil3-conversational-matching
    skill: listening
    title: "telc Hören Teil 3: Dialogues and Speaker-Activity Matching"
    prerequisites: [telc-perfekt-daily-work]
    explanation: |
      In telc Hören Teil 3, candidates listen to a conversation between two people (played twice) and match five people or objects to nine possible activities, locations, or items.
      Identify which speaker is talking and note specific preferences, responsibilities, or actions assigned to each individual.
    examples:
      - "Dialog: 'Wer bringt was zum Sommerfest mit? Sarah macht den Nudelsalat, und Thomas hat versprochen, Grillwürstchen mitzubringen.' -> Thomas: Grillwürstchen."
      - "Dialog: 'Wer übernimmt welche Aufgabe im Büro? Martin schreibt das Protokoll, und Claudia kümmert sich um die Präsentation.' -> Claudia: Präsentation."
    exercises:
      - type: multiple_choice
        question: "Gespräch: 'Was machen die Kollegen am Wochenende? Markus repariert sein Fahrrad, während Sabine wandern geht.' - Was macht Sabine?"
        options: ["Fahrrad reparieren", "Wandern gehen", "Zu Hause schlafen", "Ein Fest organisieren"]
        correctIndex: 1
      - type: multiple_choice
        question: "Gespräch: 'Wer übernimmt den Wochenenddienst im Krankenhaus? Dr. Klein hat Samstag Dienst und Dr. Frank übernimmt den Sonntag.' - Wer arbeitet am Sonntag?"
        options: ["Dr. Klein", "Dr. Frank", "Beide Ärzte gemeinsam"]
        correctIndex: 1
      - type: free_text
        prompt: "Dialog: 'Lena kauft die Getränke für die Party und Felix backt einen Kuchen.' - What does Felix do?"
        modelAnswer: "Felix backt einen Kuchen."

  - slug: telc-writing-teil1-form-completion
    skill: writing
    title: "telc Schreiben Teil 1: Extracting Information to Complete Forms"
    prerequisites: [telc-vocab-banking-official-errands]
    explanation: |
      In telc Schreiben Teil 1, candidates read three short texts (business cards, informational notes, or booking requests) and extract five missing details to complete a registration form.
      Copy the extracted information accurately into the blank fields without unnecessary words.
    examples:
      - "Text: 'Herr David Miller wohnt in Frankfurt in der Zeil 22. Er möchte ein Doppelzimmer vom 12. bis 15. Mai für sich und seine Frau buchen.' -> Formular: Straße/Hausnummer: Zeil 22; Zimmerart: Doppelzimmer."
    exercises:
      - type: fill_blank
        textWithBlank: "Text: 'Frau Dr. Julia Sommer, Kaiserstraße 14, 69115 Heidelberg. Anreise: 04. Oktober.' -> Formularfeld 'Wohnort': ___"
        correctAnswer: "Heidelberg"
      - type: fill_blank
        textWithBlank: "Text: 'Teilnehmer möchte den Kurs am Abend ab 18:30 Uhr besuchen.' -> Formularfeld 'Kurszeit': ___"
        correctAnswer: "Abend"
      - type: multiple_choice
        question: "Text: 'Zahlung erfolgt bargeldlos per EC-Karte bei der Ankunft.' - Was gehört ins Formularfeld 'Zahlungsart'?"
        options: ["Barzahlung", "EC-Karte", "Rechnung", "Kreditkarte"]
        correctIndex: 1

  - slug: telc-writing-teil2-practical-letter
    skill: writing
    title: "telc Schreiben Teil 2: Writing a 40-Word Letter Covering 3 Prompts"
    prerequisites: [telc-subordinating-conjunctions-weil-denn, telc-modal-verbs-praeteritum]
    explanation: |
      In telc Schreiben Teil 2, candidates compose a communicative note or email (approx. 40 words) choosing three out of four given guiding prompts.
      Typical situations include apologising for absence, requesting information from a landlord or authority, or rescheduling an appointment.
      Ensure you include: a proper greeting, complete sentences addressing each chosen prompt, and a polite closing formula.
    examples:
      - "Situation: Sie können wegen Krankheit nicht zum Deutschkurs kommen. Schreiben Sie an Ihre Lehrerin Frau Maier: 1. Grund des Schreibens 2. Wie lange krank? 3. Bitte um Hausaufgaben. -> 'Sehr geehrte Frau Maier, ich kann diese Woche leider nicht zum Unterricht kommen, weil ich eine schwere Grippe habe. Der Arzt hat mich bis Freitag krankgeschrieben. Können Sie mir bitte die Hausaufgaben per E-Mail schicken? Vielen Dank und freundliche Grüße, Ali Demir.'"
    exercises:
      - type: free_text
        prompt: "Schreiben Sie an Ihre Vermieterin, Frau Weber (ca. 40 Wörter): Die Heizung im Wohnzimmer ist kaputt, es ist sehr kalt. Bitten Sie um schnelle Reparatur und nennen Sie Ihre Telefonnummer."
        modelAnswer: "Sehr geehrte Frau Weber, in meiner Wohnung ist die Heizung im Wohnzimmer seit gestern defekt und es ist sehr kalt. Können Sie bitte schnell einen Handwerker schicken? Sie erreichen mich unter 0171-1234567. Mit freundlichen Grüßen, Markus Graf."
      - type: fill_blank
        textWithBlank: "Passende Anrede für einen formellen Brief an einen Mann: 'Sehr ___ Herr Müller,'"
        correctAnswer: "geehrter"
      - type: multiple_choice
        question: "Welche Grußformel ist in einem Schreiben an das Bürgeramt oder den Vermieter angemessen?"
        options: ["Liebe Küsse", "Mit freundlichen Grüßen", "Tschüss und machs gut", "Bis später"]
        correctIndex: 1

  - slug: telc-speaking-teil1-detailed-introduction
    skill: speaking
    title: "telc Sprechen Teil 1: Extended Personal Presentation and Follow-Ups"
    prerequisites: [telc-vocab-workplace-professions]
    explanation: |
      In telc Sprechen Teil 1, candidates introduce themselves using at least six complete sentences based on prompt words (Name, Herkunft, Wohnort, Familie, Beruf/Ausbildung, Sprachen, Hobbys).
      Following your introduction, the examiner will ask two detailed follow-up questions (e.g., about your daily work routine or commute).
    examples:
      - "Kandidat: 'Mein Name ist Tarik Mansour. Ich komme aus Marokko, aber ich wohne seit zwei Jahren in Nürnberg. Ich bin verheiratet und habe zwei Kinder. Von Beruf bin ich Elektriker und arbeite bei einer Baufirma. In meiner Freizeit spiele ich gerne Fußball.' - Prüfer: 'Wie kommen Sie morgens zur Arbeit?' - Kandidat: 'Ich fahre meistens mit der U-Bahn.'"
    exercises:
      - type: free_text
        prompt: "Formulate your self-introduction in German covering your profession, your daily commute, and your family status."
        modelAnswer: "Ich bin Krankenpfleger von Beruf und fahre jeden Tag mit dem Bus zur Klinik. Ich bin verheiratet und lebe mit meiner Familie in Köln."
      - type: free_text
        prompt: "Answer the examiner's question: 'Was haben Sie in Ihrem Heimatland gelernt oder gearbeitet?'"
        modelAnswer: "In meinem Heimatland habe ich als Automechaniker gearbeitet und eine Ausbildung in einer Werkstatt gemacht."
      - type: multiple_choice
        question: "Welche Antwort passt zur Prüferfrage: 'Seit wann lernen Sie schon Deutsch?'"
        options: [
          "In einer Sprachschule.",
          "Seit etwa einem Jahr lerne ich Deutsch.",
          "Deutsch ist eine schöne Sprache.",
          "Zweimal pro Woche."
        ]
        correctIndex: 1

  - slug: telc-speaking-teil2-information-exchange
    skill: speaking
    title: "telc Sprechen Teil 2: Paired Everyday Information Exchange"
    prerequisites: [telc-perfekt-daily-work]
    explanation: |
      In telc Sprechen Teil 2, test takers converse in pairs about familiar everyday themes (e.g., shopping habits, housing, weekends, holidays).
      Candidates take turns asking questions and responding with complete, descriptive answers rather than simple yes/no replies.
    examples:
      - "Kandidat A: 'Thema: Wohnen - Haben Sie einen Garten oder einen Balkon an Ihrer Wohnung?'"
      - "Kandidat B: 'Ja, wir haben einen kleinen Balkon. Im Sommer frühstücken wir dort sehr gern. Und wie wohnen Sie?'"
      - "Kandidat A: 'Ich wohne in einer Zweizimmerwohnung mitten in der Innenstadt, leider ohne Balkon.'"
    exercises:
      - type: free_text
        prompt: "Thema 'Einkaufen': Ask your partner where they usually buy groceries and why."
        modelAnswer: "Wo kaufen Sie normalerweise Ihre Lebensmittel ein und warum?"
      - type: free_text
        prompt: "Thema 'Wochenende': Respond to your partner's question about what you like to do on Sundays."
        modelAnswer: "Am Sonntag gehe ich gerne im Park spazieren und koche gemütlich für meine Familie."
      - type: multiple_choice
        question: "Partner: 'Wie oft treiben Sie in der Woche Sport?' - Welche Antwort ist kommunikativ am besten?"
        options: [
          "Nein, Sport.",
          "Ich gehe zweimal pro Woche ins Fitnessstudio und jogge am Samstag.",
          "Sport ist teuer.",
          "Um 18 Uhr."
        ]
        correctIndex: 1

  - slug: telc-speaking-teil3-joint-planning
    skill: speaking
    title: "telc Sprechen Teil 3: Joint Problem-Solving and Scheduling"
    prerequisites: [telc-vocab-scheduling-calendar-appointments, telc-conditional-wenn-clauses]
    explanation: |
      In telc Sprechen Teil 3, candidates receive task sheets with personal calendars or constraints and must collaboratively plan an activity (e.g., organizing a farewell party, planning a weekend trip, or finding a mutual appointment).
      Make suggestions, express agreement or polite disagreement, and agree upon concrete details (day, time, tasks).
    examples:
      - "Kandidat A: 'Wollen wir am Samstag zusammen für Peters Geschenk einkaufen gehen?'"
      - "Kandidat B: 'Am Samstagvormittag muss ich leider arbeiten. Passt es dir vielleicht am Samstagnachmittag um 16 Uhr?'"
      - "Kandidat A: 'Ja, 16 Uhr passt mir ausgezeichnet. Wo wollen wir uns treffen?'"
      - "Kandidat B: 'Treffen wir uns direkt vor dem Haupteingang vom Einkaufszentrum.'"
    exercises:
      - type: free_text
        prompt: "Propose an alternative day and time to your partner: you cannot meet on Friday because of work; suggest Saturday at 15:00."
        modelAnswer: "Am Freitag kann ich leider nicht, weil ich arbeiten muss. Können wir uns am Samstag um 15 Uhr treffen?"
      - type: free_text
        prompt: "Agree to your partner's suggestion and propose a concrete meeting spot."
        modelAnswer: "Das ist eine gute Idee, das passt mir gut! Wollen wir uns am Hauptbahnhof treffen?"
      - type: multiple_choice
        question: "Welcher Ausdruck eignet sich hervorragend, um in Teil 3 einen Vorschlag zu machen?"
        options: [
          "Ich schlage vor, dass wir...",
          "Ich habe keine Lust.",
          "Das ist mir egal.",
          "Du musst jetzt gehen."
        ]
        correctIndex: 0